    cv.addEventListener('pointerdown', pick);
    cv.style.cursor = 'pointer';
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.82, 440, 300); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    reset();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      sides: function(v){ N = Math.max(5, Math.min(14, v)); reset(); return N; },
      shuffle: function(k){
        var i;
        for (i = 0; i < (k || 12); i++) flip(Math.floor(Math.random()*diags.length));
        return flips;
      },
      reset: reset,
      state: function(){
        return { n:N, diagonals:diags.length, wanted:N-3, flips:flips, visited:visited,
                 total:catalan(N-2), largest:largest(), sound:allPositiveIntegers(),
                 values:Object.keys(vals).map(function(k){ return vals[k]; }) };
      },
      destroy: function(){
        running = false; cancelAnimationFrame(raf); stopResize();
        cv.removeEventListener('pointerdown', pick);
      }
    };
  }


  /* ======================================================================
     Exhibit 17 — SL(3,R) by hand. Apply a determinant-one matrix to the unit
     sphere and you get an ellipsoid of the same volume. Every such matrix
     factors as R1 . D . R2 with R1, R2 rotations and D diagonal of determinant
     one, and the ellipsoid depends only on R1 and D: a whole three dimensions
     of matrices give the identical shape. Turning on the right changes the
     matrix and slides the marks over a surface that does not move. That is the
     symmetric space SL(3,R)/SO(3), and the ordering of the axes is the Weyl
     chamber from the rank page.
     ====================================================================== */
  function ellipsoidPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.62, 470, 320), ctx = S.ctx, W = S.w, H = S.h;
    var R1 = mat3([0,1,0], 0), R2 = mat3([0,1,0], 0);
    var la = 0, lb = 0;                          // log stretches; the third follows
    var drag = null, raf = 0, running = true, glow = 0;
    var MARKS = (function(){                     // an even scatter on the unit sphere
      var out = [], n = 260, i, ga = Math.PI*(3 - Math.sqrt(5));
      for (i = 0; i < n; i++){
        var z = 1 - 2*(i + 0.5)/n, r = Math.sqrt(Math.max(0, 1 - z*z)), th = ga*i;
        out.push([r*Math.cos(th), r*Math.sin(th), z]);
      }
      return out;
    })();
    function axes(){ return [Math.exp(la), Math.exp(lb), Math.exp(-la - lb)]; }
    function diag(){ var a = axes(); return [[a[0],0,0],[0,a[1],0],[0,0,a[2]]]; }
    function shape(){ return mmul(R1, diag()); }          // what the eye can see
    function full(){ return mmul(shape(), R2); }          // the matrix itself
    function det3(M){
      return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])
           - M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])
           + M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    }
    function order(){
      var a = axes(), idx = [0,1,2];
      idx.sort(function(p, q){ return a[q] - a[p]; });
      return idx;
    }
    function say(){
      if (handlers.onEllipse) handlers.onEllipse(full(), axes(), det3(full()), order(), glow > 0);
    }
    function layout(){
      var panel = Math.max(120, Math.min(215, W*0.34));
      var left = W - panel - 28;
      var R = Math.max(40, Math.min(left*0.42, H*0.40));
      var ox = Math.max(6, (left - 2*R)/2);
      return { r:R, cx:ox + R, cy:H/2, right:ox + 2*R, mx:left + 28, mw:panel };
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var L = layout(), Sh = shape(), M = full(), i, j;
      var cam = mmul(mat3([1,0,0], 0.42), mat3([0,1,0], 0.0));
      function pr(v){
        var w = mapply(cam, v), d = 4.2, k = d/(d - w[2]);
        return [L.cx + w[0]*L.r*k*0.62, L.cy - w[1]*L.r*k*0.62, w[2]];
      }
      // the three principal sections: these depend only on R1 and D, so a turn on the
      // right leaves them exactly where they are
      var cols = [COL.rep, COL.geo, COL.ran];
      for (i = 0; i < 3; i++){
        ctx.strokeStyle = cols[i]; ctx.globalAlpha = .85; ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (j = 0; j <= 72; j++){
          var t = j/72*2*Math.PI, u = [0,0,0];
          u[(i+1)%3] = Math.cos(t); u[(i+2)%3] = Math.sin(t);
          var q = pr(mapply(Sh, u));
          if (j) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // the marks are the image of a fixed pattern on the sphere, so they slide when the
      // matrix is turned on the right even though the surface stays put
      for (i = 0; i < MARKS.length; i++){
        var q2 = pr(mapply(M, MARKS[i]));
        ctx.fillStyle = COL.hi;
        ctx.globalAlpha = 0.18 + 0.6*(q2[2] + 1)/2;
        ctx.beginPath(); ctx.arc(q2[0], q2[1], 1.7, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // the matrix, live
      var a = axes();
      ctx.font = '400 11px ' + FONT; ctx.textBaseline = 'middle';
      var cw = L.mw/3, top = L.cy - 46;
      for (i = 0; i < 3; i++) for (j = 0; j < 3; j++){
        ctx.fillStyle = glow > 0 ? COL.ran : COL.ink;
        ctx.globalAlpha = glow > 0 ? 0.55 + 0.45*glow : 1;
        ctx.textAlign = 'right';
        ctx.fillText(M[i][j].toFixed(2), L.mx + cw*(j + 0.92), top + i*22);
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = inkA(.3); ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(L.mx + 3, top - 14); ctx.lineTo(L.mx - 3, top - 14);
      ctx.lineTo(L.mx - 3, top + 58); ctx.lineTo(L.mx + 3, top + 58);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(L.mx + L.mw - 3, top - 14); ctx.lineTo(L.mx + L.mw + 3, top - 14);
      ctx.lineTo(L.mx + L.mw + 3, top + 58); ctx.lineTo(L.mx + L.mw - 3, top + 58);
      ctx.stroke();
      ctx.font = '400 9px ' + FONT; ctx.textAlign = 'left'; ctx.fillStyle = COL.soft;
      ctx.fillText('determinant ' + det3(M).toFixed(4), L.mx - 3, top + 78);
      ctx.fillText('axes ' + a.map(function(v){ return v.toFixed(2); }).join(', '), L.mx - 3, top + 92);
    }
    function loop(){
      if (glow > 0) glow = Math.max(0, glow - 0.02);
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    function down(e){ drag = { x:e.clientX, y:e.clientY };
      if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch(err){} }
    function move(e){
      if (!drag) return;
      var dx = (e.clientX - drag.x)*0.01, dy = (e.clientY - drag.y)*0.01;
      R1 = mmul(mmul(mat3([0,1,0], dx), mat3([1,0,0], dy)), R1);
      drag = { x:e.clientX, y:e.clientY };
      say();
    }
    function up(){ drag = null; }
    cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);     cv.addEventListener('pointerleave', up);
    cv.style.cursor = 'grab';
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.62, 470, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    say();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      stretch: function(which, by){
        if (which === 0) la = Math.max(-1.15, Math.min(1.15, la + by));
        else lb = Math.max(-1.15, Math.min(1.15, lb + by));
        say(); return axes();
      },
      // a rotation applied on the right: the matrix changes, the surface does not
      turnRight: function(){
        R2 = mmul(mmul(mat3(nrm([Math.random()-0.5, Math.random()-0.5, Math.random()-0.5]),
                             0.6 + Math.random()*1.6), R2), mat3([0,0,1], 0));
        glow = 1; say(); return true;
      },
      round: function(){ la = 0; lb = 0; R2 = mat3([0,1,0], 0); glow = 0; say(); },
      state: function(){
        var L = layout(), M = full(), Sh = shape();
        // M M^T is what the surface knows: it must not move when R2 does
        var G = mmul(M, mT(M));
        return { matrix:M, shape:Sh, gram:G, axes:axes(), det:det3(M), order:order(),
                 layout:{ w:W, h:H, shapeRight:L.right, matrixLeft:L.mx - 12 } };
      },
      destroy: function(){
        running = false; cancelAnimationFrame(raf); stopResize();
        cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move);
        cv.removeEventListener('pointerup', up);     cv.removeEventListener('pointerleave', up);
      }
    };
  }


  /* ======================================================================
     Exhibit 18 — the cat map. [[2,1],[1,1]] has determinant one, so it preserves
     area, and on the square torus it shears a picture, wraps it round, and mixes
     it beyond recognition. On a grid of N by N pixels it is a permutation, so it
     must return: the period is the order of the matrix in SL(2, Z/N).
     ====================================================================== */
  function catPeriod(N){
    var a = 1, b = 0, c = 0, d = 1, k, na, nb, nc, nd;
    for (k = 1; k <= 60000; k++){
      na = (2*a + c) % N; nb = (2*b + d) % N; nc = (a + c) % N; nd = (b + d) % N;
      a = na; b = nb; c = nc; d = nd;
      if (a === 1 && b === 0 && c === 0 && d === 1) return k;
    }
    return 0;
  }
  function catPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.92, 430, 300), ctx = S.ctx, W = S.w, H = S.h;
    var N = 64, grid = null, step = 0, period = 0, playing = !REDUCE, tick = 0;
    var raf = 0, running = true;
    function build(){
      grid = new Uint8Array(N*N);
      var x, y;
      for (y = 0; y < N; y++) for (x = 0; x < N; x++){
        // three bands and a disc, so both the shearing and the wrapping are legible
        var u = x/N, v = y/N, band = Math.floor(v*3) % 3;
        var inDisc = Math.hypot(u - 0.5, v - 0.5) < 0.22;
        grid[y*N + x] = inDisc ? 3 : band;
      }
      step = 0; period = catPeriod(N); tick = 0; say();
    }
    function advance(){
      var g2 = new Uint8Array(N*N), x, y;
      for (y = 0; y < N; y++) for (x = 0; x < N; x++){
        var nx = (2*x + y) % N, ny = (x + y) % N;
        g2[ny*N + nx] = grid[y*N + x];
      }
      grid = g2; step++;
      say();
    }
    function say(){
      if (handlers.onCat) handlers.onCat(N, step, period, step > 0 && period > 0 && step % period === 0);
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W, H) - 16, ox = (W - R)/2, oy = 8;
      var u = R/N, x, y;
      var cols = [COL.rep, COL.geo, COL.ran, COL.hi];
      for (y = 0; y < N; y++) for (x = 0; x < N; x++){
        ctx.fillStyle = cols[grid[y*N + x]];
        ctx.fillRect(ox + x*u, oy + (N-1-y)*u, u + 0.5, u + 0.5);
      }
      ctx.strokeStyle = inkA(.25); ctx.lineWidth = 1;
      ctx.strokeRect(ox, oy, R, R);
    }
    function loop(){
      if (playing && ++tick % 14 === 0) advance();
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.92, 430, 300); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      size: function(v){ N = Math.max(16, Math.min(160, v)); build(); return N; },
      step: function(){ advance(); return step; },
      play: function(v){ playing = !!v; return playing; },
      reset: build,
      state: function(){ return { n:N, step:step, period:period, playing:playing,
                                  home:(step > 0 && period > 0 && step % period === 0) }; },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }

  /* ======================================================================
     Exhibit 19 — Ford circles, and their Gaussian cousin. Over the integers,
     one circle sits at every fraction, tangent to the line, and two of them
     touch exactly when the fractions are Farey neighbors: ps - qr = plus or
     minus one. Swap the integers for the Gaussian integers and the same
     construction fills the plane instead of a line.
     ====================================================================== */
  function fordPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.62, 430, 300), ctx = S.ctx, W = S.w, H = S.h;
    var kind = 'ford', QMAX = 14, circles = [], tangencies = 0, frame = null;
    var raf = 0, running = true;
    function gcd(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
    function build(){
      circles = []; tangencies = 0;
      var p, q, i, j;
      if (kind === 'ford'){
        for (q = 1; q <= QMAX; q++) for (p = 0; p <= q; p++){
          if (gcd(p, q) !== 1) continue;
          circles.push({ x:p/q, y:1/(2*q*q), r:1/(2*q*q), p:p, q:q });
        }
        // the tangency law, counted rather than asserted
        for (i = 0; i < circles.length; i++) for (j = i+1; j < circles.length; j++){
          var A = circles[i], B = circles[j];
          var touch = Math.abs(Math.hypot(A.x-B.x, A.y-B.y) - (A.r+B.r)) < 1e-12;
          var farey = Math.abs(A.p*B.q - B.p*A.q) === 1;
          if (touch === farey) tangencies++;
        }
      } else {
        // the Gaussian version: images of one circle under words in the Bianchi group
        var Sm = { a:[1,0], b:[0,-1], c:[1,0], d:[0,0] };
        var T = { a:[1,0], b:[1,0], c:[0,0], d:[1,0] };
        var Ti = { a:[1,0], b:[-1,0], c:[0,0], d:[1,0] };
        var U = { a:[1,0], b:[0,1], c:[0,0], d:[1,0] };
        var Ui = { a:[1,0], b:[0,-1], c:[0,0], d:[1,0] };
        var gens = [Sm, T, Ti, U, Ui];
        var base = { c:[0, 0.5], r:0.5 };
        var frontier = [Mob.id()], seen = {}, d2, k;
        for (d2 = 0; d2 < 8 && circles.length < 4000; d2++){
          var next = [];
          for (i = 0; i < frontier.length && circles.length < 3000; i++){
            for (k = 0; k < gens.length; k++){
              var M = Mob.mul(frontier[i], gens[k]);
              if (next.length < 6000) next.push(M);     // keep walking regardless
              var im = circleImage(M, base.c, base.r);
              if (!im || !isFinite(im.r) || im.r < 0.004 || im.r > 3) continue;
              if (Math.abs(im.c[0]) > 2.4 || Math.abs(im.c[1]) > 1.8) continue;
              var key = im.c[0].toFixed(4)+'|'+im.c[1].toFixed(4)+'|'+im.r.toFixed(4);
              if (seen[key]) continue;
              seen[key] = 1;
              circles.push({ x:im.c[0], y:im.c[1], r:im.r, p:0, q:d2+1 });
            }

          frontier = next;
          if (!frontier.length) break;
        }
      }
      // frame on the circles themselves, by percentile, as the limit-set figure does
      if (kind === 'gauss' && circles.length){
        var xs = circles.map(function(c){ return c.x; }).sort(function(a,b){ return a-b; });
        var ys = circles.map(function(c){ return c.y; }).sort(function(a,b){ return a-b; });
        function q2(arr, f){ return arr[Math.min(arr.length-1, Math.floor(arr.length*f))]; }
        var cx0 = (q2(xs,0.2) + q2(xs,0.8))/2, cy0 = (q2(ys,0.2) + q2(ys,0.8))/2;
        var sp = Math.max((q2(xs,0.8)-q2(xs,0.2))/2, (q2(ys,0.8)-q2(ys,0.2))/2, 1e-6);
        frame = { cx:cx0, cy:cy0, s:1/(sp*1.9) };
      } else frame = null;
      say();
    }
    function say(){
      if (handlers.onFord) handlers.onFord(kind, circles.length, QMAX, tangencies);
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var i;
      if (kind === 'ford'){
        var sc = W*0.92, ox = W*0.04, base = H*0.9;
        ctx.strokeStyle = inkA(.35); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(0, base); ctx.lineTo(W, base); ctx.stroke();
        for (i = 0; i < circles.length; i++){
          var c = circles[i], R = c.r*sc;
          if (R < 0.4) continue;
          ctx.strokeStyle = [COL.rep, COL.geo, COL.ran, COL.hi][c.q & 3];
          ctx.globalAlpha = Math.max(0.3, Math.min(1, R/14));
          ctx.lineWidth = 1.1;
          ctx.beginPath(); ctx.arc(ox + c.x*sc, base - R, R, 0, 6.2832); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      } else {
        var base2 = Math.min(W, H)*0.46, cx = W/2, cy = H/2;
        var R2 = base2*(frame ? frame.s : 1);
        var fx = frame ? frame.cx : 0, fy = frame ? frame.cy : 0;
        for (i = 0; i < circles.length; i++){
          var c2 = circles[i], rr = c2.r*R2;
          if (rr < 0.4) continue;
          ctx.strokeStyle = [COL.rep, COL.geo, COL.ran, COL.hi][c2.q & 3];
          ctx.globalAlpha = Math.max(0.25, Math.min(0.95, rr/16));
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(cx + (c2.x-fx)*R2, cy - (c2.y-fy)*R2, rr, 0, 6.2832); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
    function loop(){ draw(); if (running) raf = requestAnimationFrame(loop); }
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.62, 430, 300); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      ring: function(k){ kind = (k === 'gauss' ? 'gauss' : 'ford'); build(); return kind; },
      depth: function(v){ QMAX = Math.max(3, Math.min(40, v)); build(); return QMAX; },
      state: function(){ return { kind:kind, circles:circles.length, qmax:QMAX, tangencies:tangencies }; },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }

  var HEIS_LADDER = [3, 4, 6, 8, 12, 16, 24, 32, 40, 48, 56];
  function heisenbergBall(n, budget){
    budget = budget || 9000;
    var A = n, C = Math.floor(n*n/4), W = 2*n + 1, D = 2*C + 1;
    var seen = new Uint8Array(W*W*D);
    var fa = new Int16Array(1), fb = new Int16Array(1), fc = new Int16Array(1), flen = 1;
    seen[A + W*(A + W*C)] = 1;
    var total = 1, d, i, g;
    var est = Math.max(1, Math.round(0.43*Math.pow(n, 4)));
    var stride = Math.max(1, Math.ceil(est/budget)), counter = 0;
    var sx = [0], sy = [0], sz = [0], sd = [0];
    var ma = 0, mb = 0, mc = 0;
    for (d = 1; d <= n; d++){
      var cap = flen*4;
      var na = new Int16Array(cap), nb = new Int16Array(cap), nc = new Int16Array(cap), nlen = 0;
      for (i = 0; i < flen; i++){
        var a = fa[i], b = fb[i], c = fc[i];
        for (g = 0; g < 4; g++){
          var xa, xb, xc;
          if (g === 0){ xa = a+1; xb = b; xc = c; }
          else if (g === 1){ xa = a-1; xb = b; xc = c; }
          else if (g === 2){ xa = a; xb = b+1; xc = c+a; }
          else { xa = a; xb = b-1; xc = c-a; }
          if (xa < -A || xa > A || xb < -A || xb > A || xc < -C || xc > C) continue;
          var k = (xa + A) + W*((xb + A) + W*(xc + C));
          if (seen[k]) continue;
          seen[k] = 1;
          na[nlen] = xa; nb[nlen] = xb; nc[nlen] = xc; nlen++;
          total++;
          if (xa > ma || -xa > ma) ma = Math.abs(xa);
          if (xb > mb || -xb > mb) mb = Math.abs(xb);
          if (xc > mc || -xc > mc) mc = Math.abs(xc);
          if ((counter++ % stride) === 0){ sx.push(xa); sy.push(xb); sz.push(xc); sd.push(d); }
        }
      }
      fa = na; fb = nb; fc = nc; flen = nlen;
      if (!nlen) break;
    }
    return { total:total, radius:n, reach:[ma, mb, mc], stride:stride,
             sx:sx, sy:sy, sz:sz, sd:sd, drawn:sx.length };
  }
  function heisenbergPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.72, 460, 320), ctx = S.ctx, W = S.w, H = S.h;
    var step = 5, mode = 'scaled', ball = null;      // ladder index; 5 is radius 16
    var yaw = -0.6, pitch = 0.36, drag = null, raf = 0, running = true, spin = !REDUCE;
    function rad(){ return HEIS_LADDER[step]; }
    function build(){
      ball = heisenbergBall(rad());
      say();
    }
    function say(){
      if (handlers.onBall){
        var r = rad();
        handlers.onBall(r, ball.total, ball.total/Math.pow(r,4), ball.total/Math.pow(r,3),
                        ball.reach, mode, ball.drawn, ball.stride);
      }
    }
    function draw(){
      if (spin && !drag) yaw += 0.0035;
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H)*0.40, cx = W/2, cy = H/2;
      var cy2 = Math.cos(yaw), sy2 = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      // scaled: a,b by n and c by n squared, which is the scaling that settles the shape.
      // as they are: one scale for all three, which shows how far out of proportion it is.
      var r = rad(), sa, sc;
      if (mode === 'scaled'){ sa = 1/r; sc = 1/(r*r); }
      else { var k = 4/(r*r); sa = k; sc = k; }
      var cols = [COL.rep, COL.geo, COL.ran, COL.hi];
      var i, band = -1;
      // the axes, so the third direction is identifiable
      ctx.strokeStyle = inkA(.16); ctx.lineWidth = 1;
      [[1.15,0,0],[0,1.15,0],[0,0,mode === 'scaled' ? 0.34 : 1.15]].forEach(function(v){
        var X1 = v[0]*cy2 - v[1]*sy2, Z1 = v[0]*sy2 + v[1]*cy2;
        var Y2 = v[2]*cp - Z1*sp, Z2 = v[2]*sp + Z1*cp;
        var kk = 3.2/(3.2 - Z2);
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + X1*R*kk, cy - Y2*R*kk); ctx.stroke();
      });
      var nd = ball.drawn;
      // squares rather than arcs once there are thousands of them: an arc per point
      // costs far more than a rectangle and at this density they look the same
      var squares = nd > 2500, sz = nd < 400 ? 2.6 : (nd < 2500 ? 1.9 : 1.3);
      for (i = 0; i < nd; i++){
        var u = ball.sx[i]*sa, v = ball.sy[i]*sa, w = ball.sz[i]*sc;
        var X1 = u*cy2 - v*sy2, Z1 = u*sy2 + v*cy2;
        var Y2 = w*cp - Z1*sp, Z2 = w*sp + Z1*cp;
        var kk = 3.2/(3.2 - Z2);
        var px = cx + X1*R*kk, py = cy - Y2*R*kk;
        if (px < -2 || px > W+2 || py < -2 || py > H+2) continue;
        var bi = ball.sd[i] & 3;
        if (bi !== band){ ctx.fillStyle = cols[bi]; band = bi; }
        ctx.globalAlpha = 0.22 + 0.6*(Z2+1)/2;
        if (squares) ctx.fillRect(px, py, sz, sz);
        else { ctx.beginPath(); ctx.arc(px, py, sz, 0, 6.2832); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }
    function loop(){ draw(); if (running) raf = requestAnimationFrame(loop); }
    function down(e){ drag = { x:e.clientX, y:e.clientY }; spin = false;
      if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch(err){} }
    function move(e){
      if (!drag) return;
      yaw += (e.clientX - drag.x)*0.008;
      pitch = Math.max(-1.45, Math.min(1.45, pitch + (e.clientY - drag.y)*0.006));
      drag = { x:e.clientX, y:e.clientY };
    }
    function up(){ drag = null; }
    cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);     cv.addEventListener('pointerleave', up);
    cv.style.cursor = 'grab';
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.72, 460, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      radius: function(v){ step = Math.max(0, Math.min(HEIS_LADDER.length-1, v)); build(); return rad(); },
      steps: function(){ return HEIS_LADDER.length; },
      view: function(m){ mode = (m === 'raw' ? 'raw' : 'scaled'); say(); return mode; },
      state: function(){
        var r = rad();
        return { radius:r, step:step, size:ball.total, drawn:ball.drawn, stride:ball.stride,
                 perN4:ball.total/Math.pow(r,4), perN3:ball.total/Math.pow(r,3),
                 reach:ball.reach, mode:mode };
      },
      destroy: function(){
        running = false; cancelAnimationFrame(raf); stopResize();
        cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move);
        cv.removeEventListener('pointerup', up);     cv.removeEventListener('pointerleave', up);
      }
    };
  }


  /* ======================================================================
     Exhibit 10 — the flat, which is what rank actually means. Fix a point in the
     symmetric space of SL(n,R) and ask in which directions you can travel while
     the geometry stays perfectly flat. For SL(2,R) the answer is a line; for
     SL(3,R) it is a Euclidean plane, cut by three walls into six chambers. The
     dimension of that flat piece is the rank, and the walls are exactly where two
     of the stretching factors coincide.
     ====================================================================== */
  var R2_ = Math.sqrt(2), R6_ = Math.sqrt(6);
  function flatT(u, v){                      // a point of the flat as three exponents summing to zero
    return [u/R2_ + v/R6_, -u/R2_ + v/R6_, -2*v/R6_];
  }
  function flatUV(t){ return [(t[0]-t[1])/R2_, (t[0]+t[1]-2*t[2])/R6_]; }
  function flatPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.62, 520, 320), ctx = S.ctx, W = S.w, H = S.h;
    var GAP = 22, LAB = 22;                     // gap between panels, room for the t labels
    // Size the circle, size the bar strip, then center the pair as one group: pinning the
    // bars to the right edge left a wide empty channel whenever the circle was limited by
    // height rather than width.
    function layout(){
      var track = Math.max(96, Math.min(200, W*0.22));
      var R = Math.max(40, Math.min((W - track - GAP - LAB)*0.46, H*0.42));
      var groupW = 2*R + GAP + LAB + track;
      var ox = Math.max(4, (W - groupW)/2);
      var x0 = ox + 2*R + GAP + LAB;
      return { r:R, cx:ox + R, cy:H/2, right:ox + 2*R,
               labelX:x0 - 6, x0:x0, x1:x0 + track, zero:x0 + track/2 };
    }
    var rank = 2, u = 0.52, v = 0.2, drag = null, anim = null;
    var raf = 0, running = true;
    var WALLS = [{ i:0, j:1, ang:Math.PI/2 },       // t1 = t2 is the vertical line
                 { i:1, j:2, ang:Math.PI/6 },       // t2 = t3
                 { i:0, j:2, ang:5*Math.PI/6 }];    // t1 = t3
    function coords(){
      if (rank === 1){ var a = u/R2_; return [a, -a]; }
      return flatT(u, v);
    }
    function order(){
      var t = coords(), idx = [], i;
      for (i = 0; i < t.length; i++) idx.push(i);
      idx.sort(function(a, b){ return t[b] - t[a]; });
      return idx;
    }
    function gaps(){
      var t = coords().slice().sort(function(a,b){ return b-a; }), g = [], i;
      for (i = 0; i + 1 < t.length; i++) g.push(t[i] - t[i+1]);
      return g;
    }
    function say(){
      if (handlers.onFlat) handlers.onFlat(rank, coords(), order(), gaps());
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var LO = layout(), R = LO.r, cx = LO.cx, cy = LO.cy, i;
      var pu = u, pv = v;
      if (anim){
        var e = 1 - Math.pow(1 - anim.t, 3);
        pu = anim.u0 + (anim.u1 - anim.u0)*e;
        pv = anim.v0 + (anim.v1 - anim.v0)*e;
      }
      if (rank === 2){
        // six chambers, tinted alternately so the walls are unmistakable
        for (i = 0; i < 6; i++){
          var a0 = Math.PI/6 + i*Math.PI/3, a1 = a0 + Math.PI/3;
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, -a1, -a0, false); ctx.closePath();
          ctx.fillStyle = inkA(i % 2 ? .05 : .02); ctx.fill();
        }
        ctx.strokeStyle = inkA(.3); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
        // the three walls
        WALLS.forEach(function(wl){
          ctx.strokeStyle = COL.ran; ctx.globalAlpha = .55; ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(cx - Math.cos(wl.ang)*R, cy + Math.sin(wl.ang)*R);
          ctx.lineTo(cx + Math.cos(wl.ang)*R, cy - Math.sin(wl.ang)*R);
          ctx.stroke(); ctx.globalAlpha = 1;
        });
        // name each chamber by the order its three factors come in
        ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = COL.soft;
        for (i = 0; i < 6; i++){
          var am = Math.PI/6 + i*Math.PI/3 + Math.PI/6;
          var t2 = flatT(Math.cos(am)*0.7, Math.sin(am)*0.7);
          var od = [0,1,2].sort(function(a,b){ return t2[b] - t2[a]; });
          ctx.fillText((od[0]+1) + '>' + (od[1]+1) + '>' + (od[2]+1),
            cx + Math.cos(am)*R*0.72, cy - Math.sin(am)*R*0.72);
        }
        ctx.fillStyle = COL.rep;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + pu*R, cy - pv*R);
        ctx.strokeStyle = COL.rep; ctx.lineWidth = 1.4; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + pu*R, cy - pv*R, 5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = COL.bg; ctx.lineWidth = 1.5; ctx.stroke();
      } else {
        // rank one: the flat is a line, and there is only one wall, the origin
        ctx.strokeStyle = inkA(.3); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
        ctx.fillStyle = inkA(.05); ctx.fillRect(cx - R, cy - 12, R, 24);
        ctx.fillStyle = inkA(.02); ctx.fillRect(cx, cy - 12, R, 24);
        ctx.strokeStyle = COL.ran; ctx.globalAlpha = .6; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy + 16); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = COL.soft;
        ctx.fillText('2>1', cx - R*0.5, cy - 24);
        ctx.fillText('1>2', cx + R*0.5, cy - 24);
        ctx.fillStyle = COL.rep;
        ctx.beginPath(); ctx.arc(cx + pu*R, cy, 5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = COL.bg; ctx.lineWidth = 1.5; ctx.stroke();
      }
      // the stretching factors, as bars: a wall is where two of them agree
      var t = rank === 1 ? [u/R2_, -u/R2_] : flatT(pu, pv);
      var half = (LO.x1 - LO.x0)/2, zero = LO.zero;
      var by = cy - t.length*13, cols = [COL.rep, COL.geo, COL.ran];
      ctx.font = '400 9px ' + FONT; ctx.textBaseline = 'middle';
      for (i = 0; i < t.length; i++){
        var yy = by + i*26, len = half*Math.min(1, Math.abs(t[i])/1.2);
        ctx.fillStyle = inkA(.08); ctx.fillRect(LO.x0, yy, half*2, 7);
        ctx.fillStyle = cols[i];
        if (t[i] >= 0) ctx.fillRect(zero, yy, len, 7); else ctx.fillRect(zero - len, yy, len, 7);
        ctx.fillStyle = COL.soft; ctx.textAlign = 'right';
        ctx.fillText('t' + (i+1), LO.labelX, yy + 4);
      }
      ctx.textAlign = 'left';
      ctx.strokeStyle = inkA(.25); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(zero, by - 8); ctx.lineTo(zero, by + t.length*26); ctx.stroke();
    }
    function loop(){
      if (anim){
        anim.t += 0.05;
        if (anim.t >= 1){ u = anim.u1; v = anim.v1; anim = null; say(); }
      }
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    function pick(e){
      var r = cv.getBoundingClientRect(), LO = layout();
      var nu = ((e.clientX - r.left) - LO.cx)/LO.r;
      var nv = (LO.cy - (e.clientY - r.top))/LO.r;
      if (rank === 1) nv = 0;
      var m = Math.hypot(nu, nv);
      if (m > 0.97){ nu = nu/m*0.97; nv = nv/m*0.97; }
      u = nu; v = nv; say();
    }
    function down(e){ drag = 1; anim = null; pick(e);
      if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch(err){} }
    function move(e){ if (drag) pick(e); }
    function up(){ drag = null; }
    cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);     cv.addEventListener('pointerleave', up);
    cv.style.cursor = 'crosshair';
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.62, 520, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    say();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      rank: function(r){
        rank = (r === 1 ? 1 : 2);
        if (rank === 1){ v = 0; if (Math.abs(u) < 0.12) u = 0.55; }
        else if (Math.abs(v) < 1e-9){ v = 0.2; }
        anim = null; say(); return rank;
      },
      // reflect in a wall: the factors swap, and the point crosses into another chamber
      reflect: function(k){
        if (anim) return false;
        var t = coords().slice();
        if (rank === 1){
          if (t.length < 2) return false;
          var nu = -u;
          anim = { u0:u, v0:v, u1:nu, v1:0, t:0 };
          return true;
        }
        var wl = WALLS[k]; if (!wl) return false;
        var tmp = t[wl.i]; t[wl.i] = t[wl.j]; t[wl.j] = tmp;
        var uv = flatUV(t);
        anim = { u0:u, v0:v, u1:uv[0], v1:uv[1], t:0 };
        return true;
      },
      reset: function(){ if (rank === 1){ u = 0.55; v = 0; } else { u = 0.52; v = 0.2; } anim = null; say(); },
      state: function(){
        var LO = layout();
        return { rank:rank, t:coords(), order:order(), gaps:gaps(), animating:!!anim,
                 dim:(rank === 1 ? 1 : 2), chambers:(rank === 1 ? 2 : 6),
                 // exposed so the no-overlap invariant can be checked rather than eyeballed
                 layout:{ w:W, h:H, circleRight:LO.right, labelLeft:LO.labelX - 12,
                          barsLeft:LO.x0, barsRight:LO.x1 } };
      },
      destroy: function(){
        running = false; cancelAnimationFrame(raf); stopResize();
        cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move);
        cv.removeEventListener('pointerup', up);     cv.removeEventListener('pointerleave', up);
      }
    };
  }

  return { hyperbolic:hyperbolic, sphere:spherePlate, spacetime:spacetime,
           solids:solidsPlate, trichotomy:trichotomyPlate, limits:limitPlate,
           klein:kleinPlate, crystal:crystalPlate, rigid:rigidPlate,
           spin:spinPlate, heisenberg:heisenbergPlate, heisenbergBall:heisenbergBall,
           flat:flatPlate, flatT:flatT, flatUV:flatUV,
           magic:magicPlate, pointPreset:pointPreset,
           perc:percPlate, expander:expanderPlate, positivity:positivityPlate,
           ellipsoid:ellipsoidPlate, cat:catPlate, ford:fordPlate, catPeriod:catPeriod,
           markov:markovPlate, aztec:aztecPlate,
           qmul:qmul, qaxis:qaxis, qmat:qmat, qClosure:qClosure,
           tauOf:tauOf, m2:m2, det2:det2, reduceSteps:reduceSteps,
           markovZ:markovZ, geoLen:geoLen, refresh:readTheme };
})();
</script>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var SHORT = MON.map(function(m){ return m.slice(0,3); });
  // The content block above assigns window.CONTENT. It is the only copy: there is no JSON to
  // parse and no file to fetch, so editing this file is the whole of editing the site.

  var teardown = [], plate = null, view = $('view'), hero = $('hero');

  /* ---------- dates ---------- */

  function fmtOne(s){ var d=D(s); return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
  function fmtRange(a,b){
    if (!b || b===a) return fmtOne(a);
    var x=D(a), y=D(b);
    if (x.getUTCFullYear()===y.getUTCFullYear()){
      if (x.getUTCMonth()===y.getUTCMonth())
        return x.getUTCDate()+'–'+y.getUTCDate()+' '+MON[x.getUTCMonth()]+' '+y.getUTCFullYear();
      return x.getUTCDate()+' '+SHORT[x.getUTCMonth()]+' – '+y.getUTCDate()+' '+SHORT[y.getUTCMonth()]+' '+y.getUTCFullYear();
    }
    return fmtOne(a)+' – '+fmtOne(b);
  }
  function season(s){
    var d=D(s), m=d.getUTCMonth(), y=d.getUTCFullYear();
    return (m<4 ? 'Spring ' : m<7 ? 'Summer ' : m<11 ? 'Autumn ' : 'Winter ') + y;
  }
  function initials(n){ return n.split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase(); }

  /* ---------- chrome ---------- */
  $('menuBtn').addEventListener('click', function(){
    var n = $('mainnav'), open = n.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');

  });

  var sheet = $('sheet');

  sheet.addEventListener('click', function(e){ if (e.target === sheet) sheet.close(); });
  var sheetScroll = 0;
  function openSheet(html){
    sheetScroll = window.scrollY || window.pageYOffset || 0;
    $('sheetIn').innerHTML = html;
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute('open','');
  }
  sheet.addEventListener('close', function(){ window.scrollTo(0, sheetScroll); });
  function portrait(p, cls){
    return '<div class="portrait'+(cls?' '+cls:'')+'">' +
      (p.photo ? '<img src="'+esc(p.photo)+'" alt="'+esc(p.name)+'" loading="lazy">'
               : '<span class="initials" aria-hidden="true">'+esc(initials(p.name))+'</span>') + '</div>';
  }
  function personSheet(p){
    openSheet(
      '<div class="top">' + portrait(p) +
        '<div><h3 style="font-size:1.5rem">'+esc(p.name)+'</h3>' +
        (p.position ? '<p class="who">'+esc(p.position)+'</p>' : '') +
        '<p class="who dim">'+esc(p.affiliation)+'</p>' +
        (p.role === 'director'
          ? '<div style="display:flex;gap:.3rem;flex-wrap:wrap"><span class="tag">Collaboration director</span></div>'
          : '')+'</div></div>' +
      '<p>'+esc(p.bio)+'</p>' +
      (p.honors ? '<p class="dim" style="font-size:.95rem"><b style="font-weight:400">Honors and service.</b> '+esc(p.honors)+'</p>' : '') +
      (p.url ? '<p><a class="link" href="'+esc(p.url)+'" target="_blank" rel="noopener">Homepage →</a></p>' : '')
    );
  }

  /* ---------- views ---------- */
  function heroHTML(){
    var s = C.home.strands;
    return '<section class="hero"><div class="hero-grid">' +
      '<div>' +
      '<h1>Discrete subgroups<br>of Lie groups: ' +
        s.map(function(x,i){ return '<button class="strand" data-k="'+x.key+'">'+x.name+'</button>' + (i<2?',<wbr> ':''); }).join('') +
      '</h1>' +
      '<div class="hero-actions"><a class="btn btn-solid" href="#/people">Sixteen investigators</a>' +
      '<a class="btn" href="#/events">Meetings</a></div></div>' +
      '<figure class="plate"><canvas class="plate-canvas" id="heroCanvas" role="img" ' +
      'aria-label="A tessellation of the hyperbolic plane in the Poincare disc, with a random walk and a point process drawn on it."></canvas>' +
      '<div class="plate-tip" aria-hidden="true"></div>' +
      '<figcaption><span><b>Plate I</b>' +
        '<span class="swap" id="heroCap"><span class="on" data-k="">Representations, geometry and randomness, on one disc.</span>' +
        s.map(function(x){ return '<span data-k="'+x.key+'">'+esc(x.caption)+'</span>'; }).join('') + '</span></span>' +
      '<span class="plate-controls">' +
        '<button class="chip" data-emph="" aria-pressed="true">All</button>' +
        s.map(function(x){ return '<button class="chip" data-emph="'+x.key+'" aria-pressed="false">'+x.title+'</button>'; }).join('') +
      '</span></figcaption></figure></div></section>';
  }

  function homeHTML(){
    return '<section class="view"><div class="wrap">' +
      '<div class="grid g-2" style="align-items:start">' +
        '<div>' + C.home.openingText.map(function(t){ return '<p class="lede" style="margin-bottom:1rem">'+esc(t)+'</p>'; }).join('') +        '</div>' +
        '<div class="grid" style="gap:.8rem">' + C.home.strands.map(function(s){
          return '<div class="card strand-card" data-k="'+s.key+'"><h3 class="'+s.key+'">'+esc(s.title)+'</h3><p class="dim" style="font-size:.96rem">'+esc(s.blurb)+'</p></div>'; }).join('') +
        '</div>' +
      '</div>' +
      '<div class="stats" style="margin-top:clamp(2rem,5vw,3.4rem)">' + C.home.stats.map(function(s){
        return '<div class="stat"><b>'+esc(s.n)+'</b><span>'+esc(s.label)+'</span></div>'; }).join('') + '</div>' +
      '</div></section>' +
      '<section class="view" style="padding-top:0"><div class="wrap">' +
      '<figure class="plate wide split" style="max-width:1100px">' +
      '<div class="plate-body">' +
      '<canvas class="plate-canvas" id="sphereCanvas" aria-label="Sixteen investigators as ideal points on the boundary sphere of hyperbolic space. Selecting a theme draws it as the hyperbolic convex hull of its members. The same information is listed as text below the figure."></canvas>' +
      '<div class="plate-tip" aria-hidden="true"></div>' +
      '</div>' +
      '<figcaption><span><b>Plate II</b>Each investigator is an ideal point on the sphere at infinity of hyperbolic ' +
        '3-space, placed by minimising a stress function so that people who share themes sit close together. Each of ' +
        'the ten themes is the hyperbolic convex hull of its members, drawn in the conformal ball, where the edges are ' +
        'circular arcs meeting the sphere at right angles. Colored by strand; the center of mass sits at the origin.</span>' +
      '<span class="plate-controls" id="themePick">' +
        '<button class="chip" data-theme="-1" aria-pressed="true">All faint</button>' +
        C.themes.map(function(t, i){
          return '<button class="chip" data-theme="'+i+'" aria-pressed="false">' +
                 '<span class="dot" data-k="'+t.strand+'"></span> '+esc(t.title)+'</button>';
        }).join('') +
        '<button class="chip" id="sphereReset">Reset view</button>' +
      '</span></figcaption></figure>' +
      // the same data as text, which is what a screen reader and a hurried reader need
      '<details class="theme-table"><summary>The ten themes, as a list</summary><dl>' +
        C.themes.map(function(t){
          return '<dt><span class="dot" data-k="'+t.strand+'"></span> '+esc(t.title)+'</dt>' +
                 '<dd>'+esc(t.members.join(', '))+'</dd>';
        }).join('') +
      '</dl></details>' +
      ((C.researchSummary || []).length
        ? '<h3 class="sec-head">The research</h3>' +
          C.researchSummary.map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('')
        : '') +
      '</div></section>';
  }

  // One figure per minipage. The controls live in the caption; the explanation is
  // beside the figure now, so the caption carries only the title, which keeps the
  // LaTeX design's figure numbering working.
  // Anything you cannot press is plain text. Boxed means clickable; there is no
  // reason for a reading to wear a button's border.
  // The closing remark is labeled for what it is. Lumping a celebrated fact and a
  // methodological obstacle together under "not known" was simply inaccurate.
  var NOTE_LABEL = { open:'Not known', hard:'The difficulty', aside:'Worth knowing' };
  // The explanation is broken into beats and one is shown at a time, so the figure
  // never moves and no panel is long enough to need scrolling. The lede is the first,
  // each paragraph its own, and the closing remark the last.

  function peopleHTML(){
    function cards(list){
      return '<div class="grid g-4">' + list.map(function(x){
        var p = x.p, i = x.i;
        var isDir = p.role === 'director';
        return '<button class="person'+(isDir ? ' is-director' : '')+'" data-person="'+i+'">' + portrait(p) +
          '<span class="nm">'+esc(p.name)+'</span>' +
          '<span class="af">'+esc(p.affiliation)+'</span>' +
          (isDir ? '<span class="role-tag">Director</span>' : '') +
        '</button>'; }).join('') + '</div>';
    }
    var indexed = C.people.map(function(p,i){ return { p:p, i:i }; });
    var byRole = function(r){ return indexed.filter(function(x){ return (x.p.role || 'pi') === r; }); };
    var director = byRole('director'), pis = byRole('pi');
    function sub(text, first){
      return '<h3 class="sec-head' + (first ? ' first' : '') + '">' + esc(text) + '</h3>';
    }

    var intro = (C.pages && C.pages.people) || '';
    return '<section class="view"><div class="view-head">' +
      '<h2>Who is involved</h2>' +
      (intro ? '<p class="lede dim">'+esc(intro)+'</p>' : '') +
      '</div><div class="wrap">' +
      sub('Principal investigators', true) +
      cards(director.concat(pis)) +
      (C.roleGroups || []).map(function(g){
        var members = indexed.filter(function(x){ return x.p.role === g.key; });
        return sub(g.name) +
          (members.length ? cards(members) : '<p class="dim sec-note">' + esc(g.note) + '</p>');
      }).join('') +
      sub('Committees') +
      '<div class="grid g-3" style="margin-top:1.2rem">' + C.committees.map(function(c){
        return '<div class="card"><h3 style="font-size:1.05rem">'+esc(c.name)+'</h3>' +
          '<p class="dim" style="font-size:.9rem">'+esc(c.note)+'</p>' +
          '<ul style="list-style:none;padding:0;margin:.6rem 0 0">' + c.members.map(function(m){
            return '<li class="mono" style="font-size:.72rem;padding:.12rem 0">'+esc(m)+'</li>'; }).join('') + '</ul></div>'; }).join('') +
      '</div></div></section>';
  }

  function eventsHTML(){
    var now = new Date();
    var list = C.events.slice().sort(function(a,b){ return D(a.start)-D(b.start); });
    return '<section class="view"><div class="view-head events-heading">' +
      '<div class="events-intro"><h2>Where and when</h2>' +
      '<p class="lede dim">Meetings, schools, workshops and thematic programs, 2027–2030.</p></div>' +
      '<button class="events-open" type="button" id="openEventVisual" aria-haspopup="dialog">Explore space–time view ↗</button>' +
      '</div><div class="wrap">' +
      '<div class="events-list">' + list.map(function(e){
        var past = D(e.end||e.start) < now;
        return '<article class="ev">' +
          '<div class="when">'+esc(season(e.start))+'<br>'+esc(fmtRange(e.start,e.end))+
            (e.confirmed===false?'<br><span style="opacity:.7">dates to be confirmed</span>':'')+'</div>' +
          '<div><h4>'+esc(e.title)+(past?' <span class="tag">past</span>':'')+'</h4>' +
          '<span class="where">'+esc(e.place)+(e.leads&&e.leads.length?' · '+esc(e.leads.join(', ')):'')+'</span>' +
          (e.blurb?'<p>'+esc(e.blurb)+'</p>':'') + '</div></article>'; }).join('') + '</div>' +
      '<h3 class="sec-head">Alongside the program</h3>' +
      '<div class="grid g-2">' + C.activities.map(function(a){
        return '<div class="card"><h3>'+esc(a.title)+'</h3><p class="dim" style="font-size:.95rem">'+esc(a.text)+'</p></div>'; }).join('') +
      '</div></div>' +
      '<dialog class="event-visual-dialog" id="eventVisual" aria-label="Events in space and time">' +
        '<div class="event-visual-shell">' +
          '<div class="event-visual-top"><h3 class="event-visual-title">Events · Space × Time</h3>' +
            '<button type="button" class="event-visual-close" id="closeEventVisual" aria-label="Close space–time view">Close ×</button></div>' +
          '<div class="event-visual-stage"><div class="plate-body">' +
            '<canvas class="plate-canvas" id="cubeCanvas"></canvas><div class="plate-tip" aria-hidden="true"></div>' +
          '</div></div>' +
          '<div class="event-visual-bottom">' +
            '<span class="event-visual-selection" id="eventVisualSelection">Select a marker to identify an event</span>' +
            '<span class="plate-controls">' +
              '<button class="chip" data-view="cube" aria-pressed="true">3D</button>' +
              '<button class="chip" data-view="map" aria-pressed="false">Map</button>' +
              '<button class="chip" data-view="time" aria-pressed="false">Time</button>' +
              '<button class="chip" data-view="spin" aria-pressed="false">Rotate</button>' +
            '</span><span class="event-visual-help">Drag to rotate · Ctrl/⌘ + scroll to zoom · Esc to close</span>' +
          '</div>' +
        '</div></dialog></section>';
  }

  function positionsHTML(){
    return '<section class="view"><div class="view-head">' +
      '<h2>Join the collaboration</h2>' +
      '<p class="lede dim">We are looking for people who want to work across representations, geometry and randomness.</p>' +
      '</div><div class="wrap"><div class="prose">' +
      C.positions.map(function(p){
        return '<div class="item"><p class="meta">'+esc(p.place)+' · '+esc(p.deadline)+'</p>' +
          '<h3>'+esc(p.title)+'</h3><p>'+esc(p.text)+'</p>' +
          (p.url?'<p><a class="link" href="'+esc(p.url)+'">Apply →</a></p>':'') + '</div>'; }).join('') +
      '<p class="note" style="margin-top:1.6rem"><b>Enquiries</b>Write to <a class="link" href="mailto:'+esc(C.site.email)+'">'+esc(C.site.email)+'</a>, or directly to the investigator whose work is closest to yours.</p>' +
      '</div></div></section>';
  }


  /* ---------- plate wiring ---------- */
  function initHero(){
    var cv = $('heroCanvas'); if (!cv || !window.Plates) return;
    var P = Plates.hyperbolic(cv); teardown.push(P.destroy);
    var pinned = '';
    function apply(k){
      P.emphasize(k || null);
      Array.prototype.forEach.call($('heroCap').children, function(c){
        c.classList.toggle('on', (c.getAttribute('data-k')||'') === (k||''));
      });
      Array.prototype.forEach.call(document.querySelectorAll('.chip[data-emph]'), function(b){
        b.setAttribute('aria-pressed', (b.getAttribute('data-emph')||'') === (k||'') ? 'true' : 'false'); });
    }
    Array.prototype.forEach.call(document.querySelectorAll('.hero .strand'), function(b){
      var k = b.getAttribute('data-k');
      b.addEventListener('mouseenter', function(){ apply(k); });
      b.addEventListener('focus', function(){ apply(k); });
      b.addEventListener('mouseleave', function(){ apply(pinned); });
      b.addEventListener('blur', function(){ apply(pinned); });
      b.addEventListener('click', function(){ pinned = (pinned===k?'':k); apply(pinned); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-emph]'), function(b){
      b.addEventListener('click', function(){ pinned = b.getAttribute('data-emph')||''; apply(pinned); });
    });
  }
  function initSphere(){
    var cv = $('sphereCanvas'); if (!cv || !window.Plates) return;
    var P = Plates.sphere(cv, C.themes, C.people, { onPerson: personSheet });
    teardown.push(P.destroy);
    var pick = $('themePick');
    if (pick) pick.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      if (b.id === 'sphereReset'){ P.reset(); return; }
      var v = b.getAttribute('data-theme'); if (v === null) return;
      P.focus(+v < 0 ? -1 : +v);
      Array.prototype.forEach.call(this.querySelectorAll('[data-theme]'), function(x){
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
    });
  }
  function initCube(){
    var dialog = $('eventVisual'), openBtn = $('openEventVisual'), closeBtn = $('closeEventVisual');
    if (!dialog || !openBtn || !window.Plates) return;
    var cv = $('cubeCanvas'), P = null;
    var sorted = C.events.slice().sort(function(a,b){ return D(a.start)-D(b.start); });
    var seen = {}, sites = [];
    C.people.forEach(function(p){
      if (!isFinite(p.lat) || !isFinite(p.lon) || seen[p.city]) return;
      seen[p.city] = 1; sites.push({ city:p.city, lat:+p.lat, lon:+p.lon });
    });
    function setMode(button){
      if (!P) return;
      P.view(button.getAttribute('data-view'));
      Array.prototype.forEach.call(dialog.querySelectorAll('.chip[data-view]'), function(x){
        x.setAttribute('aria-pressed', x===button?'true':'false');
      });
    }
    function open(){
      if (dialog.open) return;
      dialog.showModal();
      P = Plates.spacetime(cv, sorted, sites, {
        onSelect: function(i){
          var e = sorted[i];
          if (e) $('eventVisualSelection').textContent = e.city+' · '+fmtRange(e.start,e.end)+' · '+e.title;
        },
        onManual: function(){
          Array.prototype.forEach.call(dialog.querySelectorAll('.chip[data-view]'), function(x){
            x.setAttribute('aria-pressed','false');
          });
        }
      });
      P.view('cube');
      Array.prototype.forEach.call(dialog.querySelectorAll('.chip[data-view]'), function(x){
        x.setAttribute('aria-pressed',x.getAttribute('data-view')==='cube'?'true':'false');
      });
      closeBtn.focus();
    }
    function close(){ dialog.close(); }
    function onClose(){
      if (P){ P.destroy(); P=null; }
      $('eventVisualSelection').textContent = 'Select a marker to identify an event';
      openBtn.focus();
    }
    openBtn.addEventListener('click',open);
    closeBtn.addEventListener('click',close);
    dialog.addEventListener('close',onClose);
    dialog.addEventListener('click',function(e){ if(e.target===dialog)close(); });
    Array.prototype.forEach.call(dialog.querySelectorAll('.chip[data-view]'),function(b){
      b.addEventListener('click',function(){ setMode(b); });
    });
    teardown.push(function(){
      if(P){P.destroy();P=null;}
      if(dialog.open)dialog.close();
    });
  }

  /* ---------- router ---------- */
  var ROUTES = {
    '':        { sec:0, hero:true, html:homeHTML,  init:function(){ initHero(); initSphere(); } },
    'people':  { sec:2, html:peopleHTML },
    'events':  { sec:3, html:eventsHTML,  init:initCube },
    'positions':{ sec:4, html:positionsHTML }
  };
  // The route comes from the hash when there is one and from the path otherwise, so a
  // prerendered document served at /research/ resolves to the research route instead of
  // falling back to home and overwriting itself.
  // #/research/spin -> the second segment names the minipage, so every tab is a real
  // address: shareable, and the back button walks the sequence.
  function subRoute(){
    return (location.hash.replace(/^#\/?/, '').split('/')[1] || '').toLowerCase();
  }
  function routeName(){
    var h = location.hash.replace(/^#\/?/, '').split('/')[0];
    if (h) return h;
    var path = ((typeof location.pathname === 'string' ? location.pathname : '/') || '/')
      .replace(/index\.html$/, '').replace(/^\/+|\/+$/g, '').split('/');
    return path[path.length - 1] || '';
  }
  var firstPaint = true;
  function render(){
    if (!C) return;            // the content block did not load; the notice explains why
    teardown.forEach(function(f){ try{ f(); }catch(e){} }); teardown = [];
    var name = routeName(), R = ROUTES[name] || ROUTES[''];
    // If this document was prerendered for exactly this route, keep the served markup:
    // re-rendering it would throw away identical HTML and flash the page.
    var keep = firstPaint && view.getAttribute('data-prerendered') === '1' && ROUTES[name] && !subRoute();
    firstPaint = false;
    if (!keep){
      hero.innerHTML = R.hero ? heroHTML() : '';
      view.innerHTML = R.html();
    }
    $('main').setAttribute('data-sec', R.sec === undefined ? 1 : R.sec);
    view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');
    Array.prototype.forEach.call(document.querySelectorAll('nav.main a'), function(a){
      var h = (a.getAttribute('href') || '').replace(/^#\/?/, '').replace(/^\/+|\/+$/g, '');
      if (h === name) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    if (R.init) R.init();
    if (name === 'people'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-person]'), function(b){
        b.addEventListener('click', function(){ personSheet(C.people[+b.getAttribute('data-person')]); });
      });
    }
    document.title = (name ? (name.charAt(0).toUpperCase()+name.slice(1)+' — ') : '') + C.site.title;
    window.scrollTo({ top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto' });
  }
  window.addEventListener('hashchange', render);

  /* ---------- boot ---------- */
  function boot(){
    $('footMail').textContent = C.site.email; $('footMail').href = 'mailto:' + C.site.email;
    $('footFine').textContent = C.site.copyright + (C.site.lastUpdated ? '  ·  content updated ' + C.site.lastUpdated : '');

    // Required acknowledgment. The statement is fixed wording; the two names in it
    // are linked to their respective sites, as are the logos below.
    var fu = (C.site && C.site.funding) || {};
    var sfUrl = fu.sfUrl || 'https://www.simonsfoundation.org';
    var sfiUrl = fu.sfiUrl || 'https://www.sfi.org.bm';
    $('footAck').innerHTML = 'This work is supported by the ' +
      '<a href="'+esc(sfUrl)+'" target="_blank" rel="noopener">Simons Foundation</a> and ' +
      '<a href="'+esc(sfiUrl)+'" target="_blank" rel="noopener">Simons Foundation International</a>.';
    $('footLogos').innerHTML =
      '<a href="'+esc(sfUrl)+'" target="_blank" rel="noopener">' +
        '<img src="'+esc(fu.logoSf || 'https://www.simonsfoundation.org/wp-content/uploads/2026/06/logo-tile-simons-1024x682.jpg')+'" alt="Simons Foundation"></a>' +
      '<a href="'+esc(sfiUrl)+'" target="_blank" rel="noopener">' +
        '<img src="'+esc(fu.logoSfi || 'https://cdn.sfi.org.bm/wp-content/uploads/20251103145846/SFI_Logo_FULL_RGB-3.png')+'" alt="Simons Foundation International"></a>';
    // Director's Toolkit 2.2: this exact wording, with links to the program page and
    // both foundations. It lives in the footer so it is on every page.
    var mps = (C.site && C.site.mps) || {};
    $('footMps').textContent = mps.statement || '';
    $('footMpsLinks').innerHTML =
      (mps.mpsUrl
        ? '<a href="'+esc(mps.mpsUrl)+'" target="_blank" rel="noopener">Simons Collaborations in MPS</a>'
        : 'Simons Collaborations in MPS <span class="dim">(link to follow)</span>') +
      ' &middot; <a href="'+esc(sfUrl)+'" target="_blank" rel="noopener">Simons Foundation</a>' +
      ' &middot; <a href="'+esc(sfiUrl)+'" target="_blank" rel="noopener">Simons Foundation International</a>';

    // The header, the navigation and the footer headings all come from the content, so
    // that editing content.md is the whole of editing the site rather than most of it.
    var brand = $('brand');
    if (brand) brand.innerHTML = '<span>' + esc(C.site.brand || '') + '</span>' +
                                 '<b>' + esc(C.site.short || C.site.title || '') + '</b>';
    var nav = $('mainnav');
    if (nav) nav.innerHTML = (C.navigation || []).filter(function(x){ return x.inHeader; })
      .map(function(x){ return '<a href="' + esc(x.route) + '">' + esc(x.label) + '</a>'; }).join('');
    function footHeading(slot){
      var f = (C.footer || []).filter(function(x){ return x.slot === slot; })[0];
      return f ? f.heading : '';
    }
    ['collaboration', 'takepart'].forEach(function(slot){
      var box = $('footGroup' + slot.charAt(0).toUpperCase() + slot.slice(1));
      if (!box) return;
      box.innerHTML = '<h4>' + esc(footHeading(slot)) + '</h4>' +
        (C.navigation || []).filter(function(x){ return x.footerGroup === slot; })
          .map(function(x){
            return '<a href="' + esc(x.route) + '">' + esc(x.footerLabel || x.label) + '</a>';
          }).join('');
    });
    [['footContactH','contact'], ['footSupportH','support'], ['ackAboutH','about']].forEach(function(pair){
      var el2 = $(pair[0]);
      if (el2) el2.textContent = footHeading(pair[1]);
    });
    Array.prototype.forEach.call($('footLogos').querySelectorAll('img'), function(img){
      img.addEventListener('error', function(){
        var note = document.createElement('span');
        note.className = 'ack-missing';
        var src = img.getAttribute('src') || '';
        // The official Simons Foundation International asset is an EPS, which no browser
        // can put in an <img>. Say so, rather than leaving a silent gap in the footer.
        note.textContent = /\.eps$/i.test(src)
          ? img.getAttribute('alt') + ' logo: ' + src + ' is an EPS, which browsers cannot '
            + 'display. Convert it to SVG or PNG, keep the same name with the new extension, '
            + 'and point logoSfi at it in content.md.'
          : 'Missing: ' + img.getAttribute('alt') + ' logo. Add the official file at ' + src;
        img.replaceWith(note);
      });
    });
    render();
  }

  // The content block above is the only copy. If editing it left a syntax error the browser
  // will not have run it, so window.CONTENT is missing: say so at the top of the page rather
  // than showing nothing, since a blank page tells the person nothing about what they broke.
  if (!window.CONTENT || !window.CONTENT.site || !window.CONTENT.people){
    var bar = document.createElement('div');
    bar.className = 'md-warn';
    bar.textContent = 'The content block in this file could not be read, so the page cannot be '
      + 'built. This almost always means a missing quote mark, comma or bracket in the last '
      + 'edit. Undo it and reload. (Opening the browser console will name the line.)';
    document.body.insertBefore(bar, document.body.firstChild);
  } else {
    C = window.CONTENT;
    boot();
  }
})();
</script>
