<!DOCTYPE html>
<html lang="en" data-design="latex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Simons Collaboration on Discrete Subgroups of Lie Groups</title>
<meta name="description" content="Representations, Geometry and Randomness — a Simons Collaboration on discrete subgroups of Lie groups. People, research directions, events and positions.">

<style>
/* ---------- the design: LaTeX, Computer Modern ---------- */
@import url('https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/serif.css');

/* Computer Modern Unicode via jsDelivr, so the Polish and Hungarian diacritics in
   Frączyk, Erdős and Kraków are covered. The two fallbacks are the names TeX
   installs locally, which many of this site's readers will already have. */
html[data-design="latex"]{
  --paper:#FFFFFF; --paper-2:#F7F7F5; --paper-3:#EDEDEA;
  --ink:#000000; --ink-soft:#4A4A4A; --rule:#BFBFBF;
  --rep:#7A1F5C; --geo:#14563E; --ran:#6F4A00;
  --body:"Computer Modern Serif","CMU Serif","Latin Modern Roman",Georgia,serif;
  --display:var(--body); --data:var(--body);
  --fig-font:"Computer Modern Serif","CMU Serif",Georgia,serif;
  --radius:0px; --hair:1px; --disp-w:400; --disp-tr:0em;
  --case:none; --case-tr:.08em; --nav-tr:.06em; --page-tex:none;
  --fig-bg:#FFFFFF; --fig-bg-2:#F7F7F5; --fig-ink:#000000; --fig-soft:#5E5E5E;
  --fig-rep:#7A1F5C; --fig-geo:#14563E; --fig-ran:#6F4A00; --fig-hi:#000000;
  --shadow:none;
}
/* Computer Modern has a much smaller x-height than Spectral, so it needs a size
   and leading adjustment or it reads small and loose at the inherited values. */
html[data-design="latex"] body{
  font-size:clamp(1.06rem,.6vw + .95rem,1.17rem); line-height:1.5;
}
/* Justify the running prose only. At body level it also caught the nav, dates,
   affiliations and table cells, whose measures are far too short to justify. */
html[data-design="latex"] .lede,
html[data-design="latex"] .prose p,
html[data-design="latex"] .prose li,
html[data-design="latex"] .sheet-in p:not(.who),
html[data-design="latex"] .card p,
html[data-design="latex"] .ev p,
html[data-design="latex"] .item p{text-align:justify; hyphens:auto; -webkit-hyphens:auto}
html[data-design="latex"] nav.main a,
html[data-design="latex"] .person .af,
html[data-design="latex"] .ev .when,
html[data-design="latex"] .item .meta{font-variant:small-caps; text-transform:none; letter-spacing:.06em}
/* Each page is a section of the document. Home is the title block, so it is front
   matter and unnumbered; the numbered sections then run 1 to 5 with nothing
   apparently missing. Subsections and figures are numbered within their section,
   so the people page opens with Figure 1.1 and its first heading is 1.1. */
html[data-design="latex"] main[data-sec="0"]{counter-reset:sec 0 sub 0 fig 0}
html[data-design="latex"] main[data-sec="1"]{counter-reset:sec 1 sub 0 fig 0}
html[data-design="latex"] main[data-sec="2"]{counter-reset:sec 2 sub 0 fig 0}
html[data-design="latex"] main[data-sec="3"]{counter-reset:sec 3 sub 0 fig 0}
html[data-design="latex"] main[data-sec="4"]{counter-reset:sec 4 sub 0 fig 0}
html[data-design="latex"] main[data-sec="5"]{counter-reset:sec 5 sub 0 fig 0}

/* Layout follows Monograph: same two-column hero, same grids. What changes is the
   typesetting, not the furniture. */
html[data-design="latex"] .hero{border-bottom:0}
html[data-design="latex"] .hero h1{font-size:clamp(2rem,4.4vw,3.2rem); font-weight:400; line-height:1.18}
html[data-design="latex"] .hero .strand{font-style:italic}

/* numbered sections */
html[data-design="latex"] .view-head h2{font-size:clamp(1.4rem,2.2vw,1.9rem);
  font-weight:700; text-align:left; margin-bottom:.75rem}
/* a paper's first numbered section is an introduction, so §1 is titled as one */
html[data-design="latex"] .view-head h2::before{content:"\A7" counter(sec) "\2003"}
html[data-design="latex"] .sec-head{counter-increment:sub; font-weight:700; font-size:1.2rem}
/* \section and \subsection leave more room above than below, and the text that
   follows a heading sits close to it */
html[data-design="latex"] .view-head{margin-bottom:1.1rem}
html[data-design="latex"] .view-head p{margin-bottom:0}
html[data-design="latex"] .sec-head{margin:2.9rem 0 .85rem}
html[data-design="latex"] .sec-head.first{margin-top:2.4rem}
html[data-design="latex"] .sec-head + .grid{margin-top:1.3rem}
html[data-design="latex"] .sec-note{margin:-.2rem 0 1rem}
/* paragraph spacing as TeX sets it: little between paragraphs, more before a heading */
html[data-design="latex"] .prose h3{margin-top:2rem}
html[data-design="latex"] .prose p{margin-bottom:.7em}
html[data-design="latex"] .lede{margin-bottom:.8rem}
html[data-design="latex"] .sec-head::before{content:"\A7" counter(sec) "." counter(sub) "\2003"}

/* figures: frameless, numbered, captioned below and centerd */
html[data-design="latex"] figure.plate{counter-increment:fig; background:none; border:0}
html[data-design="latex"] .plate figcaption{flex-direction:column; align-items:stretch;
  justify-content:flex-start; text-align:center; gap:.7rem;
  border-top:0; font-size:.86rem; letter-spacing:0; padding:1rem .8rem 0; max-width:34rem; margin:0 auto}
/* A caption set beside its figure is a narrow column of running text, so it goes
   flush left. Centring suits a short caption under a figure, not this. */
/* Justified, like the rest of the page. A caption column is narrow, so hyphenation
   is doing real work here: without it the spaces open into rivers. */
html[data-design="latex"] .plate.split figcaption{
  text-align:justify; hyphens:auto; -webkit-hyphens:auto; max-width:none; margin:0}
html[data-design="latex"] .plate figcaption > span:first-child{display:block}
html[data-design="latex"] .plate-controls{justify-content:center}
html[data-design="latex"] .plate figcaption b{display:none}
html[data-design="latex"] .plate figcaption > span:first-child::before{
  content:"Figure " counter(sec) "." counter(fig) ". "; font-weight:700}
/* front matter has no section to number within */
html[data-design="latex"] main[data-sec="0"] .plate figcaption > span:first-child::before{
  content:"Figure " counter(fig) ". "}
html[data-design="latex"] .chip{font-variant:small-caps; text-transform:none; border-color:var(--rule)}

/* the three strands as theorem environments: bold run-in head, italic statement */
html[data-design="latex"] .strand-card{border:0; background:none; padding:0 0 .5rem}
html[data-design="latex"] .strand-card h3{display:inline; font-size:1rem; font-weight:700; letter-spacing:0}
html[data-design="latex"] .strand-card h3::after{content:"."; margin-right:.4em}
html[data-design="latex"] .strand-card p{display:inline; font-style:italic; font-size:1rem}

/* booktabs: thick rule above and below, thin rules between */
html[data-design="latex"] .ev{border-top:1px solid var(--rule)}
html[data-design="latex"] .ev:first-of-type{border-top:1.5px solid var(--ink)}
html[data-design="latex"] .ev:last-of-type{border-bottom:1.5px solid var(--ink)}
html[data-design="latex"] .ev:hover,html[data-design="latex"] .ev.on{background:var(--paper-2)}
html[data-design="latex"] .stats{border-top:1.5px solid var(--ink)}
html[data-design="latex"] .stat b{font-weight:400; font-size:clamp(1.9rem,3vw,2.6rem)}

/* bibliography-style hanging indents */
html[data-design="latex"] .prose ul{list-style:none; padding-left:0}
html[data-design="latex"] .prose ul li{padding-left:1.6rem; text-indent:-1.6rem; margin:.45rem 0}

html[data-design="latex"] .card{background:none; border:0; border-top:1px solid var(--rule); border-radius:0; padding:1rem 0}
html[data-design="latex"] .btn{border:0; border-bottom:1px solid currentColor; border-radius:0; padding:.28rem 0; font-variant:small-caps; text-transform:none; letter-spacing:.04em}
html[data-design="latex"] .btn:hover{background:none; font-style:italic}
html[data-design="latex"] .btn-solid{background:none; color:var(--ink)}
/* the source portraits are circular, so the frame follows them */
html[data-design="latex"] .portrait{border-radius:50%}
html[data-design="latex"] .link:hover{color:var(--ink)}
html[data-design="latex"] footer.site{background:none; border-top:1px solid var(--rule)}
/* \footnoterule */
html[data-design="latex"] .fine::before{content:""; display:block; width:8rem;
  border-top:1px solid var(--ink); margin:0 0 .7rem}
html[data-design="latex"] .lede{font-size:1.1em}
html[data-design="latex"] .view-head p{max-width:60ch}   /* 60 x 1.1 = 66, flush with .prose */
html[data-design="latex"] dialog.sheet{border:1px solid var(--ink); box-shadow:none}

/* a PDF read in a dark viewer, if you would rather keep the site dark */
html[data-design="latex"][data-theme="dark"]{
  --paper:#101010; --paper-2:#171717; --paper-3:#202020;
  --ink:#F2F2F0; --ink-soft:#A6A6A6; --rule:#3A3A3A;
  --rep:#E39FC8; --geo:#7FC9A9; --ran:#DCB670;
  --fig-bg:#101010; --fig-ink:#F2F2F0; --fig-soft:#9A9A9A;
  --fig-rep:#E39FC8; --fig-geo:#7FC9A9; --fig-ran:#DCB670; --fig-hi:#FFFFFF;
}

/* Justification needs a measure to work with. Below roughly 680px the gaps between
   words open into rivers, which reads as bad typesetting rather than as a paper, so
   running prose goes ragged right there. Captions and headings are unaffected. */
@media (max-width:680px){
  html[data-design="latex"] .lede,
  html[data-design="latex"] .prose p,
  html[data-design="latex"] .prose li,
  html[data-design="latex"] .fig-intro,
  html[data-design="latex"] .hero .sub p,
  html[data-design="latex"] .sheet-in p:not(.who),
  html[data-design="latex"] .card p,
  html[data-design="latex"] .ev p,
  html[data-design="latex"] .item p,
  html[data-design="latex"] .plate.split figcaption{ text-align:left }
}

</style>
<style>
/* ============================================================
   Design tokens
   Palette follows the collaboration's own color coding of its
   three strands (representations / geometry / randomness).
   Type: Spectral (a monograph serif) + IBM Plex Mono for all
   labels, data and chrome — the vernacular of a typeset paper.
   ============================================================ */
:root{
  /* The site is dark throughout. The page sits a little above the plates so the
     figures still read as recessed panels rather than merging into the page. */
  --paper:#0E1319; --paper-2:#151B23; --paper-3:#1D242E;
  --ink:#E7EAE3; --ink-soft:#9BA5B3; --rule:#262F3A;
  --fig-bg:#090D12; --fig-bg-2:#131922; --fig-ink:#E7EAE3; --fig-soft:#8A94A2;
  --rep:#F07AB4; --geo:#57C6A2; --ran:#F0BC57;
  --body:"Spectral","Iowan Old Style",Palatino,Georgia,serif;
  --display:var(--body);
  --data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* shape and voice */
  --radius:5px; --hair:1px; --disp-w:300; --disp-tr:-.02em;
  --case:uppercase; --case-tr:.18em; --nav-tr:.1em;
  --page-tex:none;
  /* figure palette: the canvases read these, so a theme reaches the plates too */
  --fig-rep:#F07AB4; --fig-geo:#57C6A2; --fig-ran:#F0BC57; --fig-hi:#ffffff;
  --fig-font:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --maxw:1160px; --gut:clamp(1.1rem,4vw,3rem);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; color-scheme:dark}
body{
  margin:0; background:var(--paper); background-image:var(--page-tex); color:var(--ink);
  font-family:var(--body); font-weight:400; font-size:clamp(1rem,.55vw + .9rem,1.09rem);
  line-height:1.62; letter-spacing:.001em;
  font-feature-settings:"onum" 1;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:var(--disp-w); line-height:1.1; letter-spacing:var(--disp-tr); margin:0}
p{margin:0 0 1em}
a{color:inherit; text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--rep); outline-offset:3px; border-radius:2px;
}
img{max-width:100%; display:block}
::selection{background:color-mix(in srgb,var(--rep) 22%,transparent)}

/* ---------- utility ---------- */
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--gut)}
.mono{font-family:var(--data)}
.skip{position:absolute; left:-999px}
.skip:focus{left:1rem; top:1rem; z-index:99; background:var(--paper); padding:.6rem 1rem; border:1px solid var(--ink)}
.rule{height:var(--hair); background:var(--rule); border:0; margin:0}
.lede{font-size:clamp(1.12rem,1.1vw + .95rem,1.5rem); font-weight:300; line-height:1.45; color:var(--ink)}
.dim{color:var(--ink-soft)}
.rep{color:var(--rep)} .geo{color:var(--geo)} .ran{color:var(--ran)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:var(--hair) solid var(--rule);
}
.topbar-in{max-width:var(--maxw); margin:0 auto; padding:.55rem var(--gut); display:flex; align-items:center; gap:1rem}
.brand{display:flex; flex-direction:column; line-height:1.15; margin-right:auto}
.brand b{font-weight:400; font-size:1.02rem; letter-spacing:-.01em}
.brand span{font-family:var(--data); font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft)}
nav.main{display:flex; gap:.15rem; align-items:center}
nav.main a{
  font-family:var(--data); font-size:.72rem; letter-spacing:var(--nav-tr); text-transform:var(--case);
  padding:.5rem .62rem; color:var(--ink-soft); border-radius:3px; position:relative;
}
nav.main a:hover{color:var(--ink); background:var(--paper-2)}
nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a[aria-current="page"]::after{
  content:""; position:absolute; left:.62rem; right:.62rem; bottom:.28rem; height:1px; background:var(--rep);
}
.icon-btn{
  font-family:var(--data); font-size:.72rem; background:none; border:1px solid var(--rule); color:var(--ink-soft);
  padding:.42rem .55rem; border-radius:3px; cursor:pointer; line-height:1;
}
.icon-btn:hover{color:var(--ink); border-color:var(--ink-soft)}
.menu-btn{display:none}
@media (max-width:860px){
  .menu-btn{display:block}
  nav.main{
    position:absolute; top:100%; left:0; right:0; background:var(--paper); border-bottom:1px solid var(--rule);
    flex-direction:column; align-items:stretch; padding:.4rem var(--gut) .8rem; display:none;
  }
  nav.main.open{display:flex}
  nav.main a{padding:.7rem .2rem; font-size:.8rem}
  nav.main a[aria-current="page"]::after{left:.2rem; right:auto; width:1.6rem}
}

/* ---------- hero ---------- */
.hero{position:relative; border-bottom:1px solid var(--rule); background:var(--fig-bg); color:var(--fig-ink)}
.hero-grid{
  max-width:var(--maxw); margin:0 auto; padding:clamp(1.6rem,4vw,3.4rem) var(--gut) clamp(1.2rem,3vw,2rem);
  display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,44%); gap:clamp(1.4rem,4vw,3rem); align-items:center;
}
@media (max-width:900px){ .hero-grid{grid-template-columns:1fr; padding-top:2rem} }
.hero h1{font-size:clamp(2.3rem,5.6vw,4.3rem); font-weight:200; letter-spacing:-.03em}
.hero h1 em{font-style:italic; font-weight:300}
.hero .strand{cursor:pointer; border:0; background:none; padding:0; font:inherit; font-style:italic; color:inherit; transition:opacity .2s}
.hero .strand[data-k="rep"]{color:var(--fig-rep)} .hero .strand[data-k="geo"]{color:var(--fig-geo)} .hero .strand[data-k="ran"]{color:var(--fig-ran)}
.hero .strand:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.18em}
.swap{display:grid}
/* inside a figure caption the swap has to flow inline, after the label */
.plate figcaption .swap{display:inline-grid; vertical-align:baseline}
.swap > *{grid-area:1/1; margin:0; opacity:0; visibility:hidden; transition:opacity .22s ease}
.swap > .on{opacity:1; visibility:visible}
.hero-actions{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.5rem}
.btn{
  font-family:var(--data); font-size:.74rem; letter-spacing:.08em; text-transform:var(--case);
  padding:.62rem .9rem; border:1px solid currentColor; border-radius:3px; cursor:pointer; background:none; color:inherit;
}
.btn:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.btn-solid{background:var(--fig-ink); color:var(--fig-bg); border-color:var(--fig-ink)}
.btn-solid:hover{background:var(--fig-hi); color:var(--fig-bg)}

/* ---------- plates (live figures) ---------- */
.plate{margin:0; background:var(--fig-bg); color:var(--fig-ink); border-radius:var(--radius); overflow:hidden; position:relative}
.plate.wide{max-width:960px; margin-inline:auto}
/* caption alongside the figure on wide screens. The canvas sits in its own element so
   that it is measured against the column it occupies rather than the whole figure. */
.plate.split{display:grid; grid-template-columns:minmax(0,1fr)}
.plate.split .plate-body{position:relative; min-width:0}
@media (min-width:900px){
  .plate.split{grid-template-columns:minmax(0,1fr) minmax(17rem,21rem)}
  .plate.split figcaption{
    border-top:0; border-left:var(--hair) solid color-mix(in srgb,var(--fig-ink) 12%,transparent);
    flex-direction:column; align-items:flex-start; justify-content:center;
    gap:1rem; padding:1.1rem 1rem;
  }
}
/* the hyperbolic disc is a circular subject: keep its frame roughly square
   rather than letting it stretch to the full width of a one-column hero */
.hero .plate{max-width:560px; margin-inline:auto}
/* pan-y keeps vertical scrolling with the page: a figure that fills the phone
   must not trap the gesture that gets you past it. Figures that need a drag opt
   in to touch-action:none only while the interact mode is on. */
.plate-canvas{display:block; width:100%; height:auto; touch-action:pan-y}
.plate-canvas.grabbing{touch-action:none}
.plate-body{position:relative}
.touch-arm{position:absolute; right:.5rem; bottom:.5rem; z-index:2}
@media (pointer:fine){ .touch-arm{display:none} }
.plate figcaption{
  display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline; justify-content:space-between;
  padding:.62rem .8rem .7rem; border-top:var(--hair) solid color-mix(in srgb,var(--fig-ink) 12%,transparent);
  font-family:var(--data); font-size:.68rem; line-height:1.6; color:var(--fig-soft); letter-spacing:.02em;
}
.plate figcaption b{color:var(--fig-ink); font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-right:.5rem}
.plate-controls{display:flex; gap:.3rem; flex-wrap:wrap; align-items:center}
/* a reading, not a control: no box, no border, no pointer */
.fig-note{font-family:var(--data); font-size:.64rem; letter-spacing:.06em; color:var(--fig-soft);
  padding:.34rem .1rem; white-space:nowrap}
.fig-tag{font-family:var(--data); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--fig-ink); opacity:.55; padding:.34rem .15rem .34rem .4rem}
.chip{
  font-family:var(--data); font-size:.64rem; letter-spacing:.06em; text-transform:var(--case); cursor:pointer;
  background:color-mix(in srgb,var(--fig-ink) 7%,transparent);
  border:var(--hair) solid color-mix(in srgb,var(--fig-ink) 18%,transparent); color:var(--fig-soft);
  padding:.34rem .5rem; border-radius:calc(var(--radius) - 2px);
  position:relative;
}
/* The visible box stays small; the touchable area does not. A pseudo-element
   extends the hit target to about 44px without disturbing the layout. */
@media (pointer:coarse){
  .chip::after, .btn::after, .icon-btn::after, .person::after{
    content:''; position:absolute; left:0; right:0; top:50%;
    height:44px; transform:translateY(-50%); min-width:44px;
  }
  .chip, .btn, .icon-btn{ position:relative }
}
.chip:hover{color:var(--fig-hi); border-color:color-mix(in srgb,var(--fig-ink) 45%,transparent)}
.chip[aria-pressed="true"]{background:var(--fig-ink); color:var(--fig-bg); border-color:var(--fig-ink)}
.plate-tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-115%);
  background:color-mix(in srgb,var(--fig-bg) 94%,transparent);
  border:var(--hair) solid color-mix(in srgb,var(--fig-ink) 22%,transparent); border-radius:calc(var(--radius) - 2px);
  padding:.4rem .55rem; font-family:var(--data); font-size:.66rem; line-height:1.45; color:var(--fig-ink);
  max-width:15rem; transition:opacity .12s; z-index:5;
}
.plate-tip.on{opacity:1}
.plate-tip .t{display:block; color:var(--fig-ran)}

/* ---------- sections ---------- */
section.view{padding:clamp(2.2rem,6vw,4.4rem) 0}
/* A minipage is meant to be taken in at a glance, so it starts high and the figure,
   its controls and the reading all sit above the fold on a laptop. */
section.view.tight{padding-top:clamp(.9rem,2vw,1.5rem); padding-bottom:clamp(1.4rem,3vw,2.2rem)}
.view-head{max-width:var(--maxw); margin:0 auto clamp(1.6rem,4vw,2.6rem); padding:0 var(--gut)}
.view-head h2{font-size:clamp(1.9rem,3.4vw,2.8rem); margin:.35rem 0 .5rem}
.sec-head{font-size:1.5rem; margin:clamp(2.4rem,5vw,3.6rem) 0 1rem}
.sec-head.first{margin-top:0}
/* the ten themes, offered as a plain list for a screen reader or a hurried reader */
.theme-table{margin:1.1rem auto 0; max-width:74ch; font-size:.95rem}
.theme-table summary{cursor:pointer; font-family:var(--data); font-size:.7rem;
  letter-spacing:.06em; text-transform:var(--case); color:var(--ink-soft)}
.theme-table dl{margin:.9rem 0 0; display:grid; grid-template-columns:minmax(12rem,20rem) 1fr; gap:.35rem 1.1rem}
.theme-table dt{display:flex; align-items:center; gap:.4rem}
.theme-table dd{margin:0; color:var(--ink-soft)}
@media (max-width:680px){ .theme-table dl{grid-template-columns:1fr; gap:.1rem .6rem}
  .theme-table dd{margin-bottom:.6rem} }
.sec-note{font-size:.95rem; margin:-.5rem 0 1rem}
/* ---------- research minipages ---------- */
.tabs{display:flex; flex-wrap:wrap; gap:.35rem; margin:0 0 clamp(.9rem,2vw,1.3rem)}
.tabs a{font-family:var(--data); font-size:.7rem; letter-spacing:.06em; text-transform:var(--case);
  padding:.4rem .7rem; border:var(--hair) solid var(--rule); border-radius:var(--radius);
  color:var(--ink-soft); text-decoration:none; white-space:nowrap}
.tabs a:hover{color:var(--ink); border-color:var(--ink-soft)}
.tabs a[aria-current]{color:var(--paper); background:var(--ink); border-color:var(--ink)}
.mini{display:grid; gap:clamp(1.2rem,3vw,2.2rem)}
.mini-title{margin:0 0 .5rem}
.mini-text p{max-width:46ch}
/* One beat at a time. A min-height keeps the controls still as the text changes, and
   the pane scrolls on its own if a beat is ever taller than the space available. */
.beats{min-height:11.5rem; max-height:calc(100vh - 20rem); overflow-y:auto; scrollbar-width:thin}
.beat[hidden]{display:none}
.beat > .lede{margin-bottom:0}
.beat > .mini-note{margin-top:0; border-top:0; padding-top:0}
.beat-nav{display:flex; align-items:center; gap:.7rem; margin-top:1rem;
  padding-top:.8rem; border-top:var(--hair) solid var(--rule)}
.beat-arrow{font-family:var(--data); font-size:1rem; line-height:1; cursor:pointer;
  background:none; border:var(--hair) solid var(--rule); color:var(--ink-soft);
  border-radius:var(--radius); padding:.15rem .5rem .25rem}
.beat-arrow:hover:not(:disabled){color:var(--ink); border-color:var(--ink-soft)}
.beat-arrow:disabled{opacity:.3; cursor:default}
.dot-row{display:flex; gap:.4rem; flex:1}
.dot-btn{width:.5rem; height:.5rem; padding:0; border-radius:50%; cursor:pointer;
  background:none; border:1px solid var(--ink-soft)}
.dot-btn:hover{border-color:var(--ink)}
.dot-btn[aria-current]{background:var(--ink); border-color:var(--ink)}
/* On a wide screen there is room for the whole explanation beside the figure, so show
   it all and let the pane scroll on its own if it outgrows the space; the figure stays
   put either way. Breaking 110 words into four clicks is only worth doing when the
   screen is narrow enough that they cannot sit together. */
@media (min-width:980px){
  .beat[hidden]{display:block}
  .beat + .beat{margin-top:.95rem}
  .beat > .mini-note{margin-top:.3rem; border-top:var(--hair) solid var(--rule); padding-top:.8rem}
  .beat-nav{display:none}
  .beats{min-height:0; max-height:calc(100vh - 15rem); padding-right:.4rem}
}
@media (max-width:979px){ .beats{max-height:none; min-height:9rem} }
.fig-hint{flex-basis:100%; font-family:var(--data); font-size:.66rem; letter-spacing:.04em;
  line-height:1.65; color:var(--fig-soft); opacity:.85; margin-top:.15rem;
  padding-top:.5rem; border-top:var(--hair) solid color-mix(in srgb,var(--fig-ink) 10%,transparent)}
.mini-note{border-top:var(--hair) solid var(--rule); padding-top:.8rem; margin-top:1.1rem;
  color:var(--ink-soft); font-size:.95rem}
.mini-note b{font-weight:600; font-family:var(--data); font-size:.7rem; letter-spacing:.06em;
  text-transform:uppercase; display:block; margin-bottom:.25rem}
.mini-note[data-kind="open"] b{color:var(--rep)}
.mini-note[data-kind="hard"] b{color:var(--ran)}
.mini-note[data-kind="aside"] b{color:var(--ink-soft)}
.mini-nav{display:flex; justify-content:space-between; gap:1rem; margin-top:1.6rem}
.mini-nav a{font-family:var(--data); font-size:.7rem; letter-spacing:.05em; color:var(--ink-soft);
  text-decoration:none}
.mini-nav a:hover{color:var(--ink)}
.mini-card{display:block; text-decoration:none}
.mini-card h4{margin:.5rem 0 .3rem; font-size:1rem}
.mini-card p{font-size:.92rem; margin:0}
.mini-n{font-family:var(--data); font-size:.66rem; color:var(--ink-soft); letter-spacing:.08em}
/* Desktop: the figure sits beside the text and stays put while the text scrolls, so the
   demo is always in view however long the reading takes. */
@media (min-width:980px){
  .mini{grid-template-columns:minmax(0,1.25fr) minmax(20rem,26rem); align-items:start}
  .mini-fig{position:sticky; top:3.2rem}
}
@media (max-width:979px){
  .tabs{overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding-bottom:.2rem}
  .tabs::-webkit-scrollbar{display:none}
}
.exhibit{margin-bottom:clamp(2.4rem,6vw,4rem)}
.exhibit .prose{margin-bottom:1.4rem}   /* measure comes from .prose */
.view-head p{max-width:62ch}
.grid{display:grid; gap:clamp(1rem,2.4vw,1.6rem)}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.g-4{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){ .g-4{grid-template-columns:repeat(4,1fr)} }

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); border-top:1px solid var(--rule)}
.stat{padding:1.1rem 0 1.2rem; border-bottom:1px solid var(--rule)}
.stat b{display:block; font-size:clamp(1.9rem,3vw,2.6rem); font-weight:200; letter-spacing:-.03em; line-height:1}
.stat span{font-family:var(--data); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}

.card{background:var(--paper-2); border:var(--hair) solid var(--rule); border-radius:var(--radius); padding:1.1rem 1.15rem}
.card h3{font-size:1.16rem; margin-bottom:.35rem}
.card p:last-child{margin-bottom:0}

/* strand-coded blocks */
.strand-card{border-left:3px solid var(--rule)}
.strand-card[data-k="rep"]{border-left-color:var(--rep)}
.strand-card[data-k="geo"]{border-left-color:var(--geo)}
.strand-card[data-k="ran"]{border-left-color:var(--ran)}
.tag{
  font-family:var(--data); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
  padding:.2rem .4rem; border:1px solid var(--rule); border-radius:2px; color:var(--ink-soft); white-space:nowrap;
}
.tag[data-k="rep"]{color:var(--rep); border-color:color-mix(in srgb,var(--rep) 40%,var(--rule))}
.tag[data-k="geo"]{color:var(--geo); border-color:color-mix(in srgb,var(--geo) 40%,var(--rule))}
.tag[data-k="ran"]{color:var(--ran); border-color:color-mix(in srgb,var(--ran) 40%,var(--rule))}

/* ---------- goals ---------- */
.dir{border-top:1px solid var(--rule); padding-top:1.4rem; margin-top:2.4rem}
.dir-head{display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; margin-bottom:.7rem}
.dir-head h3{font-size:clamp(1.4rem,2.4vw,1.9rem)}
.goal{
  display:grid; grid-template-columns:3.4rem 1fr; gap:1rem; padding:1rem 0; border-top:1px dashed var(--rule);
  align-items:start;
}
.goal:first-of-type{border-top:0}
.goal .n{font-family:var(--data); font-size:.72rem; color:var(--ink-soft); letter-spacing:.06em; padding-top:.32rem}
.goal h4{font-size:1.06rem; font-weight:400; margin-bottom:.2rem}
.goal p{margin:0; color:var(--ink-soft); font-size:.96rem}
.goal .more{margin-top:.45rem; font-size:.92rem}

/* ---------- people ---------- */
.person{
  text-align:left; background:none; border:0; padding:0; cursor:pointer; color:inherit; font:inherit;
  display:flex; flex-direction:column; gap:.42rem;
}
.portrait{
  aspect-ratio:1; border-radius:50%; overflow:hidden; background:var(--paper-3);
  border:1px solid var(--rule); position:relative; display:grid; place-items:center;
}
.portrait img{width:100%; height:100%; object-fit:cover}
.portrait .initials{font-family:var(--data); font-size:1.5rem; color:var(--ink-soft); letter-spacing:.04em}
.person:hover .portrait{border-color:var(--rep)}
.person.is-director .portrait{border-width:2px; border-color:var(--ink)}
.role-tag{font-family:var(--data); font-size:.6rem; letter-spacing:.12em;
  text-transform:var(--case); color:var(--ink); line-height:1.4}
.person .nm{font-size:1.02rem; line-height:1.25}
.person .af{font-family:var(--data); font-size:.64rem; letter-spacing:.06em; color:var(--ink-soft); line-height:1.4}
.dot{width:.42rem; height:.42rem; border-radius:50%; display:inline-block}
.dot[data-k="rep"]{background:var(--rep)} .dot[data-k="geo"]{background:var(--geo)} .dot[data-k="ran"]{background:var(--ran)}

dialog.sheet{
  border:0; padding:0; max-width:min(46rem,92vw); width:100%; background:var(--paper); color:var(--ink);
  border-radius:var(--radius); box-shadow:var(--shadow); font-family:var(--body);
}
dialog.sheet::backdrop{background:rgba(9,12,16,.55); backdrop-filter:blur(3px)}
.sheet-in{padding:clamp(1.2rem,3vw,2rem)}
.sheet-in .top{display:flex; gap:1.1rem; align-items:flex-start; margin-bottom:1rem}
.sheet-in .top .portrait{width:5.2rem; flex:0 0 auto}
/* the two meta lines under a name: never justified, never stretched */
.who{font-family:var(--data); font-size:.72rem; letter-spacing:.05em; line-height:1.5;
  margin:.35rem 0 0; text-align:left; text-wrap:pretty}
.who.dim{color:var(--ink-soft)}
.sheet-close{position:absolute; top:.6rem; right:.6rem}

/* ---------- events ---------- */
.ev{
  display:grid; grid-template-columns:8.5rem 1fr; gap:1.1rem; padding:1rem .7rem; border-top:1px solid var(--rule);
  cursor:pointer; align-items:start; border-radius:4px;
}
.ev:hover,.ev.on{background:var(--paper-2)}
.ev-list{margin-top:clamp(1.2rem,3vw,2rem)}
@media (min-width:1000px) and (min-height:720px){ .ev-list{margin-top:0} }
/* The rows drive the figure beside them, so on a tall screen the figure stays in
   view while the list scrolls. Without this the interaction appears to do nothing. */
@media (min-width:1000px) and (min-height:720px){
  .ev-split{display:grid; grid-template-columns:minmax(19rem,24rem) minmax(0,1fr);
    gap:clamp(1.4rem,3vw,2.4rem); align-items:start}
  .ev-split > .ev-figure{position:sticky; top:4.5rem}
}
.ev .when{font-family:var(--data); font-size:.7rem; letter-spacing:.04em; color:var(--ink-soft); line-height:1.5}
.ev h4{font-size:1.06rem; font-weight:400}
.ev .where{font-family:var(--data); font-size:.68rem; color:var(--ink-soft)}
.ev p{margin:.35rem 0 0; font-size:.95rem; color:var(--ink-soft)}
@media (max-width:640px){ .ev{grid-template-columns:1fr; gap:.3rem} }

/* ---------- matrix ---------- */
.matrix{width:100%; border-collapse:collapse; font-size:.9rem}
.matrix th,.matrix td{border:1px solid var(--rule); padding:.5rem .6rem; text-align:center}
.matrix th{font-family:var(--data); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; font-weight:500; color:var(--ink-soft)}
.matrix th[scope="row"]{text-align:left; text-transform:none; letter-spacing:.02em; font-size:.7rem}
.matrix td{cursor:help; font-family:var(--data)}
.matrix td[data-v="known"]{color:var(--geo); background:color-mix(in srgb,var(--geo) 8%,transparent)}
.matrix td[data-v="partial"]{color:var(--ran); background:color-mix(in srgb,var(--ran) 8%,transparent)}
.matrix td[data-v="open"]{color:var(--rep); background:color-mix(in srgb,var(--rep) 7%,transparent)}
.legend{display:flex; gap:1rem; flex-wrap:wrap; margin-top:.7rem}

/* ---------- news / positions ---------- */
.item{border-top:1px solid var(--rule); padding:1.15rem 0}
.item h3{font-size:1.15rem; margin-bottom:.3rem}
.item .meta{font-family:var(--data); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:.4rem}
.prose{max-width:66ch}
.prose h3{margin:1.8rem 0 .5rem; font-size:1.3rem}
.prose ul{padding-left:1.1rem; margin:0 0 1em}
.prose li{margin:.3rem 0}
.link{border-bottom:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.link:hover{border-bottom-color:var(--rep); color:var(--rep)}

/* ---------- footer ---------- */
footer.site{border-top:1px solid var(--rule); background:var(--paper-2); padding:2.4rem 0 3rem; margin-top:2rem}
footer.site .cols{display:grid; gap:1.6rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
footer.site h4{font-family:var(--data); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:.6rem}
/* Only the navigation columns stack. This rule used to catch the links inside the
   acknowledgement sentences too, breaking them one word per line. */
footer.site .cols > div > a{display:block; padding:.16rem 0; font-size:.95rem}
footer.site .ack a, footer.site .fine a{display:inline; padding:0}
footer.site a:hover{color:var(--rep)}
.fine{font-family:var(--data); font-size:.64rem; color:var(--ink-soft); margin-top:2rem; letter-spacing:.04em}
.ack{font-size:.9rem; color:var(--ink-soft); margin:0 0 .9rem}
.ack-about{border-top:var(--hair) solid var(--rule); margin-top:2rem; padding-top:1.2rem; max-width:78ch}
.ack-about h4{margin-bottom:.5rem}
.ack a{border-bottom:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.ack a:hover{color:var(--rep); border-bottom-color:var(--rep)}
/* The one light element on the site, and deliberately so: the usage rules forbid
   altering the official logo files, so they sit on their own white panel rather
   than being recolored to suit a dark page. */
.ack-logos{display:flex; flex-wrap:wrap; gap:1.1rem; align-items:center;
  background:#fff; padding:.75rem .9rem; border-radius:2px; width:fit-content}
.ack-logos img{height:34px; width:auto; display:block}
/* shown when content.md could not be read, so that a stale page never looks current */
.md-warn{font-family:var(--data); font-size:.68rem; line-height:1.5; text-align:center;
  background:#FBE9E9; color:#7A2E2E; border-bottom:1px solid #C08A8A; padding:.5rem .8rem}
.ack-missing{font-family:var(--data); font-size:.58rem; line-height:1.35; color:#7A2E2E;
  border:1px dashed #C08A8A; padding:.35rem .45rem; border-radius:2px; max-width:13rem; display:block}

.note{
  border:1px dashed color-mix(in srgb,var(--ran) 55%,var(--rule)); background:color-mix(in srgb,var(--ran) 7%,transparent);
  border-radius:4px; padding:.8rem .9rem; font-size:.9rem;
}
.note b{font-family:var(--data); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:.25rem; color:var(--ran)}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
.fade-in{animation:fade .5s ease both}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

     negative a tiling of the hyperbolic plane. The hyperbolic mirror is the

        ctx.strokeStyle = inkA(.28); ctx.lineWidth = 1; ctx.stroke();
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.clip();
        ctx.strokeStyle = COL.geo; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
        (tiles||[]).forEach(function(c){
          ctx.beginPath(); ctx.arc(cx + c.x*R, cy - c.y*R, c.r*R, 0, 6.2832); ctx.stroke();
        });
        ctx.globalAlpha = 0.5; ctx.strokeStyle = COL.geo;
        for (var i = 0; i < 2*p; i++){                        // the mirrors through the center
          var a = i*Math.PI/p;
          ctx.beginPath(); ctx.moveTo(cx - Math.cos(a)*R, cy + Math.sin(a)*R);
          ctx.lineTo(cx + Math.cos(a)*R, cy - Math.sin(a)*R); ctx.stroke();
        }
        ctx.restore(); ctx.globalAlpha = 1;
      } else if (Math.abs(k) < 1e-12){                        // flat: a periodic tiling
        ctx.strokeStyle = COL.ran; ctx.globalAlpha = 0.65; ctx.lineWidth = 1;
        var step = R*0.34, gx, gy;
        ctx.save(); ctx.beginPath(); ctx.rect(cx-R, cy-R*0.8, 2*R, 1.6*R); ctx.clip();
        if (p === 4){                                          // {4,4} squares
          for (gx = -8; gx <= 8; gx++){
            ctx.beginPath(); ctx.moveTo(cx+gx*step, cy-R); ctx.lineTo(cx+gx*step, cy+R); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-R, cy+gx*step); ctx.lineTo(cx+R, cy+gx*step); ctx.stroke();

            for (gx = -9; gx <= 9; gx++){

              ctx.beginPath(); ctx.moveTo(x0, cy+gy*h); ctx.lineTo(x0+step/2, cy+(gy+1)*h); ctx.stroke();

        ctx.strokeStyle = inkA(.2); ctx.lineWidth = 1; ctx.stroke();

    var stopResize = onResize(function(){ var s = fit(cv, 0.82, 460, 300); ctx=s.ctx; W=s.w; H=s.h; drv.wake(); });
    return {
      set: function(np, nq){ p = Math.max(3, Math.min(12, np)); q = Math.max(3, Math.min(12, nq)); rebuild(); drv.wake(); return { p:p, q:q, k:curvature(p,q), solid:pqSolid(p,q) }; },
      state: function(){ return { p:p, q:q, k:curvature(p,q), solid:pqSolid(p,q) }; },
      destroy: function(){ drv.stop(); stopResize(); }
    };
  }

  /* ======================================================================
     Exhibit 3 — Kleinian limit sets. Three circles inside a fourth, and the
     group generated by inversion in each. Tangent, and the limit set is the
     Apollonian gasket; pulled apart, it breaks into a Cantor dust of circles.
     ====================================================================== */
  function limitPlate(cv){
    var S = fit(cv, 0.82, 460, 300), ctx = S.ctx, W = S.w, H = S.h;
    var gap = 0, depth = 6, circles = [], gens = [], raf = 0, running = true;
    function rebuild(){
      var R0 = 2*Math.sqrt(3) - 3, d = 1 - R0, rr = Math.max(0.02, R0 - gap), i;
      gens = [];
      for (i = 0; i < 3; i++){
        var a = Math.PI/2 + i*2*Math.PI/3;
        gens.push({ x: d*Math.cos(a), y: d*Math.sin(a), r: rr });
      }
      var out = gens.map(function(c){ return {x:c.x, y:c.y, r:c.r, g:1}; });
      var seen = {}, frontier = out.slice(), lvl;
      function key(c){ return c.x.toFixed(4)+'|'+c.y.toFixed(4)+'|'+c.r.toFixed(4); }
      out.forEach(function(c){ seen[key(c)] = 1; });
      for (lvl = 0; lvl < depth && frontier.length && out.length < 2600; lvl++){
        var next = [];
        frontier.forEach(function(c){

            var im = invert(c, g);

            var kk = key(im);
            if (seen[kk]) return;

      }

    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H)*0.44, cx = W/2, cy = H/2;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832);
      ctx.strokeStyle = inkA(.3); ctx.lineWidth = 1; ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R*1.02, 0, 6.2832); ctx.clip();
      circles.forEach(function(c){

        ctx.strokeStyle = c.g === 1 ? COL.ran : COL.rep;
        ctx.globalAlpha = c.g === 1 ? 0.95 : Math.max(0.12, 0.62 - deep*0.4);
        ctx.lineWidth = c.g === 1 ? 1.6 : 1;

    var drv = driver(cv, function(){ draw(); return false; });
    var stopResize = onResize(function(){ var s = fit(cv, 0.82, 460, 300); ctx=s.ctx; W=s.w; H=s.h; drv.wake(); });
    return {
      set: function(g, dep){
        gap = Math.max(0, Math.min(0.09, g));
        depth = Math.max(2, Math.min(8, dep));

        return { gap:gap, depth:depth, circles:circles.length, tangent:gap < 1e-9 };
      },
      state: function(){ return { gap:gap, depth:depth, circles:circles.length, tangent:gap < 1e-9 }; },
      destroy: function(){ drv.stop(); stopResize(); }
    };
  }


  /* ======================================================================
     Exhibit 4 — a Kleinian group on the Riemann sphere. Four circles paired by
     Mobius maps; the group they generate is free and discrete, and its limit set
     is the dust the orbits pile up on. Pressing a generator flows a test point

     ====================================================================== */
  function clog(z){ return [0.5*Math.log(Cx.abs2(z) || 1e-300), Math.atan2(z[1], z[0])]; }
  function cpow(z, t){ return Cx.exp(Cx.scale(clog(z), t)); }
  function mobPow(M, t){
    var N = Mob.norm(M), tau = Cx.add(N.a, N.d);
    if (tau[0] < 0){ N = { a:Cx.scale(N.a,-1), b:Cx.scale(N.b,-1), c:Cx.scale(N.c,-1), d:Cx.scale(N.d,-1) };

    if (Cx.abs2(disc) < 1e-16){                                  // parabolic
      return { a:[1 + t*(N.a[0]-1), t*N.a[1]], b:Cx.scale(N.b, t),
               c:Cx.scale(N.c, t),            d:[1 + t*(N.d[0]-1), t*N.d[1]] };

    return { a:f(N.a,1), b:f(N.b,0), c:f(N.c,0), d:f(N.d,1) };

  function mobApply(M, z){                                        // z as a complex pair
    var num = Cx.add(Cx.mul(M.a, z), M.b), den = Cx.add(Cx.mul(M.c, z), M.d);

  // once-punctured-torus group built from the traces of its two generators, with the
  // commutator forced parabolic — the same cubic the rigidity figure walks on.
  var KLEIN_GROUPS = [
    { key:'fuchsian',   name:'Fuchsian',    real:true,  ta:[3,0],       tb:[3,0],
      note:'not fractal: the circles pile onto one round circle' },
    { key:'gasket',     name:'Gasket',      ta:[2,0],        tb:[2,0],
      note:'both generators parabolic; a chain of tangent circles' },
    { key:'asymmetric', name:'Asymmetric',  ta:[2,0],        tb:[3,0],
      note:'one parabolic generator, one not' },
    { key:'wild',       name:'Wild',        ta:[1.91,0.05],  tb:[1.91,0.05],
      note:'a fractal curve, wandering far from where it started' },
    { key:'deep',       name:'Near collapse', ta:[1.87,0.1], tb:[1.87,0.1],
      note:'close to the edge of the family, where the curve begins to pinch shut' }

  function grandma(g){
    if (g.real){

    var ta2 = Cx.mul(ta, ta), tb2 = Cx.mul(tb, tb);
    var disc = Cx.sqrt(Cx.sub(Cx.mul(ta2, tb2), Cx.scale(Cx.add(ta2, tb2), 4)));

  function isoCircle(M){                        // center -d/c, radius 1/|c| for det 1
    if (Cx.abs2(M.c) < 1e-24) return null;

  }
  // A Mobius map sends circles to circles, so map three points and fit the circle
  // through the images. This is what makes the classical pictures: nested circles
  // closing down on the limit set, rather than a scatter of isolated points.
  var C3 = [[1,0], [-0.5, 0.8660254], [-0.5, -0.8660254]];

    var p = [], k, q;
    for (k = 0; k < 3; k++){

    var CIRC = [], PTS = [], view = { s:1, cx:0, cy:0 }, fitted = null;

    var off = null, offCtx = null, dirty = true;

    function build(){

      gens = { a:G.a, A:Mob.inv(G.a), b:G.b, B:Mob.inv(G.b) };
      var opp = { a:'A', A:'a', b:'B', B:'b' };

      for (k = 0; k < 4; k++) iso[order[k]] = isoCircle(gens[order[k]]);

      // the set to within its own radius. Going deeper and keeping only centers gives the
      // set itself, densely, instead of the scaffolding that converges to it.
      // Depth-first, descending each branch until its circle is small enough to stand in
      // for a point of the set, then recording that center. A single radius threshold
      // applied breadth-first cannot work here: near a cusp the circles shrink slowly, so
      // whole sectors never reached the threshold and the Fuchsian circle came out dashed.
      // Descend each branch until its circle is small enough to stand in for a point of the
      // set, always expanding the largest circle left so that wherever the budget runs out
      // the coverage is even. A single threshold cannot serve every group: fine enough for
      // the Fuchsian circle starves the near-degenerate ones, and coarse enough for those
      // leaves the circle dashed. So it runs fine first and coarsens only if starved.
      var pxs = [], out = [], seen = {}, cap = 7000;

      function descend(tiny, budget){

              if (r2 < heap.length && heap[r2].r > heap[big].r) big = r2;

          if (im2.r > 0.0012 && out.length < cap){
            var ck = im2.c[0].toFixed(4)+'|'+im2.c[1].toFixed(4)+'|'+im2.r.toFixed(4);

          }

      // because the circles are spread more widely than the set they close on.

      xs.sort(function(a2,b2){ return a2-b2; });
      ys.sort(function(a2,b2){ return a2-b2; });
      function q(arr, f){ return arr[Math.min(arr.length-1, Math.max(0, Math.floor(arr.length*f)))]; }
      var cx0 = (q(xs,0.02) + q(xs,0.98))/2, cy0 = (q(ys,0.02) + q(ys,0.98))/2;
      var spread = Math.max((q(xs,0.98) - q(xs,0.02))/2, (q(ys,0.98) - q(ys,0.02))/2, 1e-6);

      }
    }
    function paint(target, list, lw){
      var R = Math.min(W, H), sc = view.s*R, i, band = -1;
      var cols = [COL.rep, COL.ran, COL.geo, COL.hi];
      target.lineWidth = lw;
      for (i = 0; i < list.length; i++){
        var c = list[i];
        var x = W/2 + (c.c[0] - view.cx)*sc, y = H/2 - (c.c[1] - view.cy)*sc;
        var rad = c.r*sc;
        if (rad < 0.35) continue;
        if (x + rad < 0 || x - rad > W || y + rad < 0 || y - rad > H) continue;

    }
    // the set itself: one dot per deep circle center
    function paintPoints(target){
      var R = Math.min(W, H), sc = view.s*R, i, band = -1;
      var cols = [COL.rep, COL.ran, COL.geo, COL.hi];
      for (i = 0; i < PTS.length; i += 3){
        var x = W/2 + (PTS[i] - view.cx)*sc, y = H/2 - (PTS[i+1] - view.cy)*sc;
        if (x < 0 || x > W || y < 0 || y > H) continue;

          ctx.fillStyle = COL.rep;

        ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = mk[2];
        ctx.fillText(mk[0], mx, y0 - 8);
      });
      ctx.setLineDash([]);
      ctx.strokeStyle = COL.rep; ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (i = 0; i < src.length; i++){
        var cx2 = x0 + src[i][0]*w, cy2 = y0 + h - Math.min(1, src[i][1]/top)*h;
        if (i) ctx.lineTo(cx2, cy2); else ctx.moveTo(cx2, cy2);
      }
      ctx.stroke();
      // mark the steepest stretch, which is the jump if there is one
      var sp = steepest();
      if (dimCurve.length && sp.rise > 0.18 && sp.at > 0){
        var i0 = sp.at - sp.span;
        ctx.strokeStyle = COL.ran; ctx.lineWidth = 2.4; ctx.globalAlpha = .9;
        ctx.beginPath();
        ctx.moveTo(x0 + src[i0][0]*w, y0 + h - src[i0][1]*h);
        ctx.lineTo(x0 + src[sp.at][0]*w, y0 + h - src[sp.at][1]*h);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
      var mx2 = x0 + p*w;
      ctx.strokeStyle = COL.hi; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(mx2, y0); ctx.lineTo(mx2, y0 + h); ctx.stroke();
      ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = COL.soft;
      ctx.fillText(dimCurve.length ? 'boundary dimension of the largest cluster'
                                   : 'clusters reaching across', x0 + w/2, y0 + h + 16);
      ctx.fillText('0', x0, y0 + h + 30); ctx.fillText('p', x0 + w/2, y0 + h + 30);
      ctx.fillText('1', x0 + w, y0 + h + 30);
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var L = layout(), R = L.r, ox = L.ox, oy = L.oy, i;
      var cols = [COL.rep, COL.geo, COL.ran, COL.hi];
      if (kind === 'hi'){
        // the interior has no honest planar drawing, so show the boundary it measures:
        // a pair of ends from each tree, colored by which cluster reaches it
        var side = Math.ceil(Math.sqrt(bnd.length)), cell = R/Math.max(1, side);
        for (i = 0; i < bnd.length; i++){
          var bx = i % side, byy = (i / side) | 0;
          var rt = find(bnd[i]);

          ctx.fillRect(ox + bx*cell, oy + byy*cell, Math.max(1, cell - 1), Math.max(1, cell - 1));
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = inkA(.15); ctx.lineWidth = 1;
        ctx.strokeRect(ox, oy, R, R);
        drawCurve(L);
        return;
      }
      ctx.lineWidth = kind === 'grid' ? 1.4 : 1.1;
      for (i = 0; i < edges.length; i++){
        if (!open_[i]) continue;
        var a = nodes[edges[i][0]], b = nodes[edges[i][1]];
        ctx.strokeStyle = cols[find(edges[i][0]) % 4];
        ctx.globalAlpha = .8;
        ctx.beginPath();
        ctx.moveTo(ox + a[0]*R, oy + (1-a[1])*R);
        ctx.lineTo(ox + b[0]*R, oy + (1-b[1])*R);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = inkA(.15); ctx.lineWidth = 1;

    }

    var stopResize = onResize(function(){ var s2 = fit(cv, 0.72, 440, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      substrate: function(k){
        kind = (['grid','tree','h2','hi'].indexOf(k) >= 0) ? k : 'grid';
        build(); return kind;
      },
      prob: function(v){ p = Math.max(0, Math.min(1, v)); resample(); return p; },
      again: function(){ newSample(); return true; },
      curve: function(){ return curve.slice(); },
      dims: function(){ return dimCurve.slice(); },
      jump: function(){ return steepest().rise; },
      state: function(){
        var L = layout();
        return { kind:kind, p:p, spanning:spanning, biggest:biggest, n:nodes.length,
                 edges:edges.length, boundary:bnd.length, radius:ballR,
                 pc:PC[kind], pu:PU[kind], curve:curve.length,
                 layout:{ w:W, h:H, netRight:L.right, curveLeft:L.px - 14 } };
      },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }

  /* ======================================================================
     Exhibit 13 — expansion. A random walk on a ring takes forever to forget
     where it started; on a random regular graph it forgets almost at once.
     That gap is what a spectral gap is, and property (T) is its group-level
     cousin.
     ====================================================================== */
  function expanderPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.66, 420, 300), ctx = S.ctx, W = S.w, H = S.h;
    var kind = 'expander', n = 120, adj = [], dist = [], step = 0, tv = 1;
    var raf = 0, running = true, playing = !REDUCE;
    function build(){
      var i, j;
      adj = [];
      for (i = 0; i < n; i++) adj.push([]);
      if (kind === 'ring'){
        for (i = 0; i < n; i++){ adj[i].push((i+1)%n); adj[i].push((i+n-1)%n); }
      } else {
        var tries = 0;
        while (tries++ < 60){
          for (i = 0; i < n; i++) adj[i] = [];
          var stubs = [];
          for (i = 0; i < n; i++) for (j = 0; j < 3; j++) stubs.push(i);
          for (i = stubs.length - 1; i > 0; i--){
            var q = Math.floor(Math.random()*(i+1)), t = stubs[i]; stubs[i] = stubs[q]; stubs[q] = t;
          }
          var ok = true;
          for (i = 0; i + 1 < stubs.length; i += 2){
            var a = stubs[i], b = stubs[i+1];
            if (a === b || adj[a].indexOf(b) >= 0){ ok = false; break; }
            adj[a].push(b); adj[b].push(a);
          }
          if (ok) break;
        }
        for (i = 0; i < n; i++) if (!adj[i].length){ adj[i].push((i+1)%n); adj[(i+1)%n].push(i); }
      }
      restart();
    }
    function restart(){
      dist = []; step = 0;
      for (var i = 0; i < n; i++) dist.push(0);
      dist[0] = 1; measure(); say();
    }
    function measure(){
      var s = 0;
      for (var i = 0; i < n; i++) s += Math.abs(dist[i] - 1/n);
      tv = 0.5*s;
    }
    function advance(){
      var nd = [], i, k;
      for (i = 0; i < n; i++) nd.push(0);
      for (i = 0; i < n; i++){
        if (!dist[i]) continue;
        var share = dist[i]/adj[i].length;
        for (k = 0; k < adj[i].length; k++) nd[adj[i][k]] += share;
      }
      dist = nd; step++; measure();
    }
    function say(){ if (handlers.onExp) handlers.onExp(kind, step, tv, n); }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H)*0.38, cx = W*0.36, cy = H/2, i, k;
      ctx.strokeStyle = inkA(.12); ctx.lineWidth = 1;
      for (i = 0; i < n; i++){
        var a1 = 2*Math.PI*i/n;
        for (k = 0; k < adj[i].length; k++){
          var j = adj[i][k];
          if (j < i) continue;
          var a2 = 2*Math.PI*j/n;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a1)*R, cy + Math.sin(a1)*R);
          ctx.quadraticCurveTo(cx, cy, cx + Math.cos(a2)*R, cy + Math.sin(a2)*R);
          ctx.stroke();
        }
      }
      var mx = 0;
      for (i = 0; i < n; i++) if (dist[i] > mx) mx = dist[i];
      for (i = 0; i < n; i++){
        var a = 2*Math.PI*i/n, f = mx > 0 ? dist[i]/mx : 0;
        ctx.fillStyle = f > 0.02 ? COL.rep : COL.soft;
        ctx.globalAlpha = 0.25 + 0.75*Math.pow(f, 0.4);
        ctx.beginPath(); ctx.arc(cx + Math.cos(a)*R, cy + Math.sin(a)*R, 2 + 4*Math.pow(f,0.5), 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // how far from uniform, as a falling bar
      var bx = W*0.78, bw = W*0.16, by = cy - 60;
      ctx.fillStyle = inkA(.08); ctx.fillRect(bx, by, bw, 120);
      ctx.fillStyle = COL.ran; ctx.fillRect(bx, by + 120*(1-tv), bw, 120*tv);
      ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = COL.soft;
      ctx.fillText('distance from', bx + bw/2, by - 16);
      ctx.fillText('even spread', bx + bw/2, by - 6);
      ctx.fillText(tv.toFixed(3), bx + bw/2, by + 132);
    }
    function loop(){
      if (playing && step < 400 && tv > 1e-4){ advance(); if (step % 4 === 0) say(); }
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.66, 420, 300); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE){ for (var q = 0; q < 40; q++) advance(); draw(); }
    else raf = requestAnimationFrame(loop);
    return {
      graph: function(k){ kind = (k === 'ring' ? 'ring' : 'expander'); build(); return kind; },
      restart: restart,
      play: function(v){ playing = !!v; return playing; },
      state: function(){ return { kind:kind, step:step, tv:tv, n:n, playing:playing }; },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }


  /* ======================================================================
     Exhibit 14 — Vieta jumping. The mapping class group acts on the character
     variety, and on the cubic x^2+y^2+z^2 = xyz that action is generated by
     three moves, each replacing one coordinate by xy - z. The orbit of (3,3,3)
     is a tree, its entries are three times the Markov numbers, and it runs off
     to infinity rather than filling anything up: that is properness.
     ====================================================================== */
  function markovPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.74, 440, 320), ctx = S.ctx, W = S.w, H = S.h;
    var nodes = [], gens = 4, biggest = 0, offCubic = 0;
    var raf = 0, running = true, spin = 0;
    function move(t, k){
      if (k === 0) return [t[1]*t[2] - t[0], t[1], t[2]];
      if (k === 1) return [t[0], t[0]*t[2] - t[1], t[2]];
      return [t[0], t[1], t[0]*t[1] - t[2]];
    }
    function build(){
      nodes = [{ t:[3,3,3], x:0.5, y:0.5, d:0, from:-1 }];
      var frontier = [{ i:0, a0:0, a1:2*Math.PI }], d, k, q;
      biggest = 3; offCubic = 0;
      // one node per distinct triple: from (3,3,3) all three moves give the same one,
      // so without this the tree carries three copies of it
      var seen = { '3,3,3':1 };
      function fresh(u){
        var s2 = u.slice().sort(function(a,b){ return a-b; }).join(',');
        if (seen[s2]) return false;
        seen[s2] = 1; return true;
      }
      for (d = 1; d <= gens; d++){
        var next = [], r = d/(gens + 0.35)*0.46;
        for (k = 0; k < frontier.length; k++){
          var f = frontier[k], base = nodes[f.i].t;
          var kids = [];
          for (q = 0; q < 3; q++){
            var u = move(base, q);
            if (Math.min(u[0], u[1], u[2]) < 3) continue;
            var same = u[0] === base[0] && u[1] === base[1] && u[2] === base[2];
            if (same) continue;
            var back = nodes[f.i].from >= 0 &&
              u[0] === nodes[nodes[f.i].from].t[0] && u[1] === nodes[nodes[f.i].from].t[1] &&
              u[2] === nodes[nodes[f.i].from].t[2];
            if (back) continue;
            if (!fresh(u)) continue;
            kids.push(u);
          }
          var span = (f.a1 - f.a0)/Math.max(1, kids.length);
          for (q = 0; q < kids.length; q++){
            var a0 = f.a0 + q*span, a1 = a0 + span, am = (a0 + a1)/2, u2 = kids[q];
            nodes.push({ t:u2, x:0.5 + r*Math.cos(am), y:0.5 + r*Math.sin(am), d:d, from:f.i });
            next.push({ i:nodes.length - 1, a0:a0, a1:a1 });
            biggest = Math.max(biggest, u2[0], u2[1], u2[2]);
            var e = Math.abs(u2[0]*u2[0] + u2[1]*u2[1] + u2[2]*u2[2] - u2[0]*u2[1]*u2[2]);
            if (e > 1e-6) offCubic++;
          }
        }
        frontier = next;
        if (nodes.length > 400) break;
      }
      say();
    }
    function say(){ if (handlers.onMarkov) handlers.onMarkov(nodes.length, gens, biggest, offCubic); }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H) - 30, ox = (W - R)/2, oy = 15, i;
      function px(nd){ return ox + nd.x*R; }
      function py(nd){ return oy + (1 - nd.y)*R; }
      ctx.strokeStyle = inkA(.24); ctx.lineWidth = 1;
      for (i = 1; i < nodes.length; i++){
        var a = nodes[i], b = nodes[a.from];
        ctx.beginPath(); ctx.moveTo(px(b), py(b)); ctx.lineTo(px(a), py(a)); ctx.stroke();
      }
      ctx.font = '400 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (i = 0; i < nodes.length; i++){
        var nd = nodes[i], big = Math.max(nd.t[0], nd.t[1], nd.t[2]);
        ctx.fillStyle = nd.d === 0 ? COL.hi : (nd.d < 3 ? COL.rep : COL.geo);
        ctx.beginPath(); ctx.arc(px(nd), py(nd), nd.d === 0 ? 5 : 3.2, 0, 6.2832); ctx.fill();
        if (nd.d <= 2 && nodes.length < 120){
          ctx.fillStyle = COL.soft;
          ctx.fillText(nd.t.slice().sort(function(a2,b2){ return a2-b2; }).join(','),
                       px(nd), py(nd) - 10);
        }
      }
    }
    function loop(){ draw(); if (running) raf = requestAnimationFrame(loop); }
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.74, 440, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE) draw(); else raf = requestAnimationFrame(loop);
    return {
      grow: function(v){ gens = Math.max(1, Math.min(5, v)); build(); return gens; },
      state: function(){ return { nodes:nodes.length, gens:gens, biggest:biggest, offCubic:offCubic,
                                  triples:nodes.slice(0,6).map(function(nd){ return nd.t.slice().sort(function(a,b){return a-b;}); }) }; },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }

  /* ======================================================================
     Exhibit 15 — dominoes on the Aztec diamond. Local flips wander through the
     tilings; the corners freeze into a single orientation while the middle
     stays disordered, and the line between them is the arctic circle. Every
     flip is checked to leave a valid tiling.
     ====================================================================== */
  function aztecPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.86, 470, 320), ctx = S.ctx, W = S.w, H = S.h;
    var ord = 12, cells = null, doms = [], occ = null, flips = 0, bad = 0;
    var raf = 0, running = true, playing = !REDUCE;
    function key(x, y){ return x + ',' + y; }
    function build(){
      cells = {}; doms = []; flips = 0; bad = 0;
      var y, x, w, rows = {};
      for (y = -ord; y < ord; y++){
        w = y >= 0 ? ord - y : ord + y + 1;
        for (x = -w; x < w; x++){ cells[key(x,y)] = 1; (rows[y] = rows[y] || []).push(x); }
      }
      Object.keys(rows).forEach(function(ky){
        var xs = rows[ky].sort(function(a,b){ return a-b; }), i;
        for (i = 0; i + 1 < xs.length; i += 2) doms.push(['h', xs[i], +ky]);
      });
      occ = {};
      doms.forEach(function(d, k){
        occ[key(d[1], d[2])] = k;
        occ[d[0] === 'h' ? key(d[1]+1, d[2]) : key(d[1], d[2]+1)] = k;
      });
      say();
    }
    function step(){
      var k = Math.floor(Math.random()*doms.length), d = doms[k], o = d[0], x = d[1], y = d[2];
      var k2 = -1, dd = 0, i;
      if (o === 'h'){
        for (i = 0; i < 2; i++){
          var dy = i ? -1 : 1, cand = occ[key(x, y+dy)];
          if (cand !== undefined && cand !== k){
            var e = doms[cand];
            if (e[0] === 'h' && e[1] === x && e[2] === y+dy){ k2 = cand; dd = dy; break; }
          }
        }
        if (k2 < 0) return false;
        var yy = Math.min(y, y+dd);
        doms[k] = ['v', x, yy]; doms[k2] = ['v', x+1, yy];
        occ[key(x,yy)] = k; occ[key(x,yy+1)] = k;
        occ[key(x+1,yy)] = k2; occ[key(x+1,yy+1)] = k2;
      } else {
        for (i = 0; i < 2; i++){
          var dx = i ? -1 : 1, cand2 = occ[key(x+dx, y)];
          if (cand2 !== undefined && cand2 !== k){
            var e2 = doms[cand2];
            if (e2[0] === 'v' && e2[1] === x+dx && e2[2] === y){ k2 = cand2; dd = dx; break; }
          }
        }
        if (k2 < 0) return false;
        var xx = Math.min(x, x+dd);
        doms[k] = ['h', xx, y]; doms[k2] = ['h', xx, y+1];
        occ[key(xx,y)] = k; occ[key(xx+1,y)] = k;
        occ[key(xx,y+1)] = k2; occ[key(xx+1,y+1)] = k2;
      }
      flips++;
      return true;
    }
    function validate(){
      var seen = {}, k, d, a, b;
      for (k = 0; k < doms.length; k++){
        d = doms[k];
        a = key(d[1], d[2]); b = d[0] === 'h' ? key(d[1]+1, d[2]) : key(d[1], d[2]+1);
        if (seen[a] || seen[b] || !cells[a] || !cells[b]) return false;
        seen[a] = 1; seen[b] = 1;
      }
      return Object.keys(seen).length === Object.keys(cells).length;
    }
    function frozen(){
      // share of dominoes in the four extremes sitting in a single orientation
      var lim = ord*0.62, tot = 0, agree = 0, k;
      for (k = 0; k < doms.length; k++){
        var d = doms[k];
        if (Math.abs(d[2]) > lim){ tot++; if (d[0] === 'h') agree++; }
        else if (Math.abs(d[1]) > lim){ tot++; if (d[0] === 'v') agree++; }
      }
      return tot ? agree/tot : 0;
    }
    function say(){ if (handlers.onAztec) handlers.onAztec(ord, doms.length, flips, frozen()); }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H) - 20, u = R/(2*ord), cx = W/2, cy = H/2, k;
      var cols = [COL.rep, COL.geo, COL.ran, COL.hi];
      for (k = 0; k < doms.length; k++){
        var d = doms[k], x = d[1], y = d[2];
        var par = (((x + y) % 2) + 2) % 2;
        ctx.fillStyle = cols[(d[0] === 'h' ? 0 : 2) + par];
        ctx.globalAlpha = .92;
        if (d[0] === 'h') ctx.fillRect(cx + x*u, cy - (y+1)*u, 2*u - 0.6, u - 0.6);
        else ctx.fillRect(cx + x*u, cy - (y+2)*u, u - 0.6, 2*u - 0.6);
      }
      ctx.globalAlpha = 1;
    }
    function loop(){
      if (playing){ var i; for (i = 0; i < 260; i++) step(); if (flips % 900 < 260) say(); }
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    var stopResize = onResize(function(){ var s2 = fit(cv, 0.86, 470, 320); ctx=s2.ctx; W=s2.w; H=s2.h; draw(); });
    build();
    if (REDUCE){ var q; for (q = 0; q < 40000; q++) step(); say(); draw(); }
    else raf = requestAnimationFrame(loop);
    return {
      order: function(v){ ord = Math.max(4, Math.min(26, v)); build(); return ord; },
      play: function(v){ playing = !!v; return playing; },
      reset: build,
      valid: validate,
      state: function(){ return { order:ord, dominoes:doms.length, flips:flips,
                                  frozen:frozen(), playing:playing }; },
      destroy: function(){ running = false; cancelAnimationFrame(raf); stopResize(); }
    };
  }


  /* ======================================================================
     Exhibit 16 — positivity. Triangulate a polygon and give every diagonal the
     value one. Flipping a diagonal replaces it with the other diagonal of the
     quadrilateral its two triangles form, and Ptolemy's relation fixes the new
     value: x_new = (ac + bd)/x_old. Flip as long as you like and the values stay
     positive whole numbers. That is the Laurent phenomenon, and positivity of
     this kind is what higher Teichmuller theory is built on. The flips also walk
     the associahedron: the triangulations of an n-gon number a Catalan number.
     ====================================================================== */
  function catalan(k){
    var c = 1, i;
    for (i = 0; i < k; i++) c = c*2*(2*i + 1)/(i + 2);
    return Math.round(c);
  }
  function positivityPlate(cv, handlers){
    handlers = handlers || {};
    var S = fit(cv, 0.82, 440, 300), ctx = S.ctx, W = S.w, H = S.h;
    var N = 9, diags = [], vals = {}, seen = {}, visited = 0, flips = 0;
    var lastFlip = null, glow = 0, bad = 0;
    var raf = 0, running = true;
    function ekey(a, b){ return Math.min(a,b) + '-' + Math.max(a,b); }
    function reset(){
      diags = []; vals = {}; seen = {}; visited = 0; flips = 0; bad = 0; lastFlip = null;
      var j;
      for (j = 2; j <= N - 2; j++){ diags.push([0, j]); vals[ekey(0, j)] = 1; }
      note(); say();
    }
    function edgeSet(){
      var E = {}, i;
      for (i = 0; i < N; i++) E[ekey(i, (i+1) % N)] = 1;
      for (i = 0; i < diags.length; i++) E[ekey(diags[i][0], diags[i][1])] = 1;
      return E;
    }
    function note(){
      var sig = diags.map(function(d){ return ekey(d[0], d[1]); }).sort().join(',');
      if (!seen[sig]){ seen[sig] = 1; visited++; }
    }
    function val(a, b){
      var k = ekey(a, b);
      return vals[k] === undefined ? 1 : vals[k];         // a side of the polygon
    }
    // the two vertices completing a diagonal into triangles, one on each side
    function apexes(d){
      var i = Math.min(d[0], d[1]), j = Math.max(d[0], d[1]), E = edgeSet();
      var inner = [], outer = [], k;
      for (k = i + 1; k < j; k++) if (E[ekey(i,k)] && E[ekey(k,j)]) inner.push(k);
      for (k = j + 1; k < N; k++) if (E[ekey(j,k)] && E[ekey(k,i)]) outer.push(k);
      for (k = 0; k < i; k++) if (E[ekey(j,k)] && E[ekey(k,i)]) outer.push(k);
      return [inner, outer];
    }
    function flip(idx){
      var d = diags[idx];
      if (!d) return false;
      var ap = apexes(d);
      if (ap[0].length !== 1 || ap[1].length !== 1) return false;
      var k = ap[0][0], l = ap[1][0];
      var i = Math.min(d[0], d[1]), j = Math.max(d[0], d[1]);
      var num = val(i,k)*val(j,l) + val(i,l)*val(j,k);
      var old = val(i,j), nv = num/old;
      if (!(nv > 0) || Math.abs(nv - Math.round(nv)) > 1e-9) bad++;
      delete vals[ekey(i,j)];
      diags[idx] = [Math.min(k,l), Math.max(k,l)];
      vals[ekey(k,l)] = Math.round(nv);

      note(); say();
      return true;
    }
    function largest(){
      var m = 0;
      Object.keys(vals).forEach(function(k){ if (vals[k] > m) m = vals[k]; });
      return m;
    }
    function allPositiveIntegers(){
      var ok = true;

      if (handlers.onPos)

    }
    function pos(i){
      var a = -Math.PI/2 + 2*Math.PI*i/N;
      return [Math.cos(a), Math.sin(a)];
    }
    function draw(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H);
      var R = Math.min(W,H)*0.40, cx = W/2, cy = H/2, i;
      function X(v){ return cx + v[0]*R; }
      function Y(v){ return cy - v[1]*R; }
      ctx.strokeStyle = inkA(.3); ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (i = 0; i <= N; i++){ var v = pos(i % N); if (i) ctx.lineTo(X(v), Y(v)); else ctx.moveTo(X(v), Y(v)); }
      ctx.stroke();
      ctx.font = '400 10px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (i = 0; i < diags.length; i++){
        var a = pos(diags[i][0]), b = pos(diags[i][1]);
        var hot = i === lastFlip && glow > 0;
        ctx.strokeStyle = hot ? COL.ran : COL.rep;
        ctx.globalAlpha = hot ? 1 : .85;
        ctx.lineWidth = hot ? 2.2 : 1.5;
        ctx.beginPath(); ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b)); ctx.stroke();
        ctx.globalAlpha = 1;
        var mx = (X(a) + X(b))/2, my = (Y(a) + Y(b))/2;
        var v2 = val(diags[i][0], diags[i][1]);
        ctx.fillStyle = COL.bg;
        ctx.beginPath(); ctx.arc(mx, my, 8.5, 0, 6.2832); ctx.fill();
        ctx.fillStyle = hot ? COL.ran : COL.ink;
        ctx.fillText(String(v2), mx, my);
      }
      ctx.fillStyle = COL.soft;
      for (i = 0; i < N; i++){
        var p2 = pos(i);
        ctx.beginPath(); ctx.arc(X(p2), Y(p2), 2.6, 0, 6.2832); ctx.fill();
      }
    }
    function loop(){
      if (glow > 0) glow = Math.max(0, glow - 0.04);
      draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    function pick(e){
      var r = cv.getBoundingClientRect(), R = Math.min(W,H)*0.40, cx = W/2, cy = H/2;
      var px = e.clientX - r.left, py = e.clientY - r.top, best = -1, bd = 14, i;
      for (i = 0; i < diags.length; i++){
        var a = pos(diags[i][0]), b = pos(diags[i][1]);
        var ax = cx + a[0]*R, ay = cy - a[1]*R, bx = cx + b[0]*R, by = cy - b[1]*R;
        var dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy;
        var t = L2 ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy)/L2)) : 0;
        var d2 = Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
