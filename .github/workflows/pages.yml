name: Publish website and events preview

on:
  push:
    branches:
      - main
      - events-list-first-fullscreen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production website
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false

      - name: Check out experimental events branch
        uses: actions/checkout@v4
        with:
          ref: events-list-first-fullscreen
          path: events-preview
          persist-credentials: false

      - name: Assemble both sites, without changing production files
        run: |
          set -euo pipefail
          mkdir -p _site/preview/events
          rsync -a --exclude='.git' --exclude='.github' production/ _site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' events-preview/ _site/preview/events/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/preview/events/index.html
          echo 'Production: /'
          echo 'Events preview: /preview/events/#/events'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production and events preview
        id: deployment
        uses: actions/deploy-pages@v4
